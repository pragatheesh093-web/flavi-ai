<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: white;
    background: #120b1d;
    overflow: hidden;
}


/* =========================================================
   ANIMATED DREAMY BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -10;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255, 120, 190, .20),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 15%,
            rgba(167, 110, 255, .20),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(255, 100, 170, .15),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #100918,
            #1b102b,
            #110b1e
        );

    background-size: 200% 200%;

    animation:
        dreamyGradient 16s ease infinite;
}

@keyframes dreamyGradient {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}


/* =========================================================
   GLOWING BLOBS
========================================================= */

.blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .35;
    pointer-events: none;
}

.blob.one {
    width: 330px;
    height: 330px;
    background: #ff6fb5;
    top: -100px;
    left: -80px;
    animation: blobOne 12s ease-in-out infinite;
}

.blob.two {
    width: 420px;
    height: 420px;
    background: #8c63ff;
    right: -160px;
    top: 15%;
    animation: blobTwo 15s ease-in-out infinite;
}

.blob.three {
    width: 300px;
    height: 300px;
    background: #ff8bd1;
    left: 35%;
    bottom: -170px;
    animation: blobThree 14s ease-in-out infinite;
}

@keyframes blobOne {

    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(100px,80px) scale(1.2);
    }
}

@keyframes blobTwo {

    0%,100% {
        transform: translate(0,0);
    }

    50% {
        transform: translate(-100px,100px) scale(1.15);
    }
}

@keyframes blobThree {

    0%,100% {
        transform: translate(0,0);
    }

    50% {
        transform: translate(-70px,-80px) scale(1.2);
    }
}


/* =========================================================
   FLOATING FLOWERS
========================================================= */

.flowers {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.flower {
    position: absolute;
    font-size: 24px;
    opacity: .65;

    animation:
        floatFlower linear infinite;
}

.flower:nth-child(1) {
    left: 8%;
    animation-duration: 14s;
    animation-delay: -3s;
}

.flower:nth-child(2) {
    left: 20%;
    animation-duration: 18s;
    animation-delay: -8s;
    font-size: 18px;
}

.flower:nth-child(3) {
    left: 35%;
    animation-duration: 15s;
    animation-delay: -5s;
}

.flower:nth-child(4) {
    left: 52%;
    animation-duration: 20s;
    animation-delay: -12s;
    font-size: 17px;
}

.flower:nth-child(5) {
    left: 68%;
    animation-duration: 16s;
    animation-delay: -7s;
}

.flower:nth-child(6) {
    left: 82%;
    animation-duration: 19s;
    animation-delay: -10s;
    font-size: 20px;
}

.flower:nth-child(7) {
    left: 94%;
    animation-duration: 13s;
    animation-delay: -4s;
}

@keyframes floatFlower {

    0% {
        transform:
            translateY(110vh)
            translateX(0)
            rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: .65;
    }

    50% {
        transform:
            translateY(50vh)
            translateX(40px)
            rotate(180deg);
    }

    90% {
        opacity: .65;
    }

    100% {
        transform:
            translateY(-15vh)
            translateX(-30px)
            rotate(360deg);
        opacity: 0;
    }
}


/* =========================================================
   SPARKLES
========================================================= */

.sparkles {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.sparkle {
    position: absolute;
    color: rgba(255,255,255,.8);
    font-size: 12px;

    animation:
        sparkleAnimation 3s ease-in-out infinite;
}

.sparkle:nth-child(1) {
    left: 12%;
    top: 25%;
}

.sparkle:nth-child(2) {
    left: 28%;
    top: 70%;
    animation-delay: 1s;
}

.sparkle:nth-child(3) {
    left: 48%;
    top: 18%;
    animation-delay: .5s;
}

.sparkle:nth-child(4) {
    left: 73%;
    top: 60%;
    animation-delay: 1.7s;
}

.sparkle:nth-child(5) {
    left: 88%;
    top: 30%;
    animation-delay: .8s;
}

@keyframes sparkleAnimation {

    0%,100% {
        transform: scale(.5);
        opacity: .2;
    }

    50% {
        transform: scale(1.5);
        opacity: 1;
    }
}


/* =========================================================
   COMMON SCREEN
========================================================= */

.screen {
    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}


/* =========================================================
   GLASS CARD
========================================================= */

.card {
    width: 440px;
    max-width: 100%;

    padding: 42px 35px;

    border-radius: 32px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.045)
        );

    border: 1px solid rgba(255,255,255,.15);

    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.12);

    text-align: center;

    animation:
        cardAppear .7s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =========================================================
   LOGO
========================================================= */

.logo-wrap {
    width: 95px;
    height: 95px;

    margin: 0 auto 20px;

    border-radius: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(255,125,190,.3),
            rgba(177,118,255,.25)
        );

    border: 1px solid rgba(255,255,255,.18);

    box-shadow:
        0 15px 45px rgba(255,105,180,.2);

    animation:
        logoFloat 4s ease-in-out infinite;
}

.logo {
    font-size: 55px;

    filter:
        drop-shadow(
            0 8px 15px rgba(255,100,180,.35)
        );
}

@keyframes logoFloat {

    0%,100% {
        transform: translateY(0) rotate(-2deg);
    }

    50% {
        transform: translateY(-8px) rotate(2deg);
    }
}


/* =========================================================
   TITLES
========================================================= */

h1 {
    font-size: 36px;
    letter-spacing: -1px;
    margin-bottom: 10px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffb5da,
            #d5b8ff,
            #fff
        );

    background-size: 250%;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation:
        titleGradient 6s ease infinite;
}

@keyframes titleGradient {

    0%,100% {
        background-position: 0%;
    }

    50% {
        background-position: 100%;
    }
}

.subtitle {
    color: rgba(255,255,255,.68);
    line-height: 1.6;
    margin-bottom: 25px;
}


/* =========================================================
   INPUT
========================================================= */

input {
    width: 100%;

    padding: 16px 18px;

    border-radius: 17px;

    border: 1px solid rgba(255,255,255,.12);

    background:
        rgba(0,0,0,.22);

    color: white;

    font-size: 16px;

    outline: none;

    transition:
        .25s ease;
}

input::placeholder {
    color: rgba(255,255,255,.42);
}

input:focus {
    border-color: rgba(255,125,190,.65);

    box-shadow:
        0 0 0 4px rgba(255,105,180,.10),
        0 10px 30px rgba(255,105,180,.08);
}


/* =========================================================
   BUTTON
========================================================= */

button {
    border: none;
    cursor: pointer;

    color: white;

    font-size: 15px;
    font-weight: 700;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: translateY(0);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}


/* =========================================================
   MAIN BUTTON
========================================================= */

.primary-button {
    width: 100%;

    margin-top: 15px;

    padding: 16px;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            #ff70b5,
            #b76cff
        );

    box-shadow:
        0 12px 30px rgba(255,105,180,.25);
}

.primary-button:hover {
    box-shadow:
        0 16px 40px rgba(255,105,180,.38);
}


/* =========================================================
   GOOGLE BUTTON
========================================================= */

.google-button {
    width: 100%;

    padding: 15px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid rgba(255,255,255,.16);

    color: white;

    backdrop-filter: blur(15px);
}

.google-button:hover {
    background:
        rgba(255,255,255,.14);
}


/* =========================================================
   ACCOUNT INFO
========================================================= */

.account-info {
    margin-top: 18px;

    color: rgba(255,255,255,.45);

    font-size: 13px;
}

.error {
    margin-top: 15px;

    color: #ff9ebd;

    font-size: 13px;

    white-space: pre-wrap;
}


/* =========================================================
   CHAT SCREEN
========================================================= */

#chatScreen {
    display: none;

    width: 100%;
    height: 100vh;

    position: relative;
}


/* =========================================================
   TOP BAR
========================================================= */

.top-bar {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 72px;

    z-index: 50;

    display: flex;
    align-items: center;

    padding:
        0 22px;

    background:
        rgba(15,8,25,.62);

    border-bottom:
        1px solid rgba(255,255,255,.09);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
}


/* =========================================================
   FLAVI TITLE
========================================================= */

.flavi-title {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 19px;
    font-weight: 800;
}

.flavi-status {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #6dffb0;

    box-shadow:
        0 0 12px #6dffb0;

    animation:
        statusPulse 2s infinite;
}

@keyframes statusPulse {

    0%,100% {
        opacity: .5;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================================
   USER INFO
========================================================= */

.user-info {
    margin-left: auto;
    margin-right: 12px;

    color: rgba(255,255,255,.55);

    font-size: 12px;
}


/* =========================================================
   LOGOUT
========================================================= */

.logout-button {
    width: auto;

    padding: 9px 15px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid rgba(255,255,255,.1);
}

.logout-button:hover {
    background:
        rgba(255,100,160,.15);
}


/* =========================================================
   MESSAGES AREA
========================================================= */

#messages {

    position: absolute;

    top: 72px;
    bottom: 88px;

    left: 0;
    right: 0;

    overflow-y: auto;

    padding:
        30px
        max(20px, calc((100vw - 1000px) / 2))
        30px;

    scroll-behavior: smooth;
}


/* scrollbar */

#messages::-webkit-scrollbar {
    width: 7px;
}

#messages::-webkit-scrollbar-track {
    background: transparent;
}

#messages::-webkit-scrollbar-thumb {
    background:
        rgba(255,255,255,.12);

    border-radius: 20px;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    max-width: min(720px, 78%);

    padding:
        14px 18px;

    margin:
        12px 0;

    border-radius: 22px;

    line-height: 1.6;

    white-space: pre-wrap;

    word-wrap: break-word;

    animation:
        messageAppear .3s ease;

    box-shadow:
        0 8px 25px rgba(0,0,0,.12);
}

@keyframes messageAppear {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   USER MESSAGE
========================================================= */

.message.user {

    margin-left: auto;

    border-bottom-right-radius: 7px;

    background:
        linear-gradient(
            135deg,
            #ff69ad,
            #b96cff
        );

    box-shadow:
        0 10px 30px rgba(255,105,180,.18);
}


/* =========================================================
   AI MESSAGE
========================================================= */

.message.ai {

    margin-right: auto;

    border-bottom-left-radius: 7px;

    background:
        rgba(255,255,255,.075);

    border:
        1px solid rgba(255,255,255,.09);

    backdrop-filter: blur(15px);
}


/* =========================================================
   TYPING
========================================================= */

.typing {
    color: rgba(255,255,255,.6);
    font-style: italic;
}

.typing::after {
    content: "";
    display: inline-block;

    width: 5px;
    height: 5px;

    margin-left: 5px;

    border-radius: 50%;

    background: #ff91c7;

    box-shadow:
        9px 0 #ff91c7,
        18px 0 #ff91c7;

    animation:
        typingDots 1.2s infinite;
}

@keyframes typingDots {

    0%,100% {
        opacity: .25;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================================
   INPUT AREA
========================================================= */

.input-area {

    position: fixed;

    left: 50%;

    transform: translateX(-50%);

    bottom: 18px;

    width:
        min(900px, calc(100% - 30px));

    padding: 8px;

    display: flex;

    gap: 8px;

    z-index: 40;

    border-radius: 22px;

    background:
        rgba(18,10,30,.72);

    border:
        1px solid rgba(255,255,255,.12);

    box-shadow:
        0 15px 50px rgba(0,0,0,.35);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
}

.input-area input {

    flex: 1;

    border: none;

    background:
        rgba(255,255,255,.06);

    margin: 0;

    padding:
        14px 17px;
}

.input-area input:focus {
    box-shadow: none;
    border: none;
}

.input-area button {

    width: 105px;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #ff70b5,
            #a96dff
        );

    box-shadow:
        0 8px 22px rgba(255,105,180,.2);
}


/* =========================================================
   WELCOME MESSAGE
========================================================= */

.welcome-message {
    text-align: center;

    color:
        rgba(255,255,255,.45);

    padding: 20px;

    font-size: 14px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

    .card {
        padding:
            32px 23px;

        border-radius: 27px;
    }

    h1 {
        font-size: 31px;
    }

    .logo-wrap {
        width: 82px;
        height: 82px;
    }

    .logo {
        font-size: 46px;
    }

    .top-bar {
        height: 64px;
        padding: 0 13px;
    }

    .flavi-title {
        font-size: 16px;
    }

    .user-info {
        display: none;
    }

    #messages {
        top: 64px;
        bottom: 85px;

        padding:
            20px 13px;
    }

    .message {
        max-width: 88%;

        padding:
            12px 15px;

        font-size: 14px;
    }

    .input-area {
        bottom: 10px;

        width:
            calc(100% - 18px);
    }

    .input-area button {
        width: 78px;
    }

    .logout-button {
        padding:
            8px 10px;

        font-size: 12px;
    }
}


/* =========================================================
   VERY SMALL SCREENS
========================================================= */

@media (max-width: 380px) {

    .input-area button {
        width: 62px;
        font-size: 13px;
    }

    .input-area {
        gap: 5px;
    }

}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }

}

</style>
</head>

========================================================= */

const googleButton =
    document.createElement("button");

googleButton.className =
    "google-button";

googleButton.textContent =
    "🔵  Continue with Google";

googleButton.addEventListener(
    "click",
    loginWithGoogle
);

document
    .getElementById("googleLogin")
    .appendChild(googleButton);


/* =========================================================
   GOOGLE LOGIN
========================================================= */

async function loginWithGoogle() {

    loginError.textContent = "";

    googleButton.disabled = true;

    googleButton.textContent =
        "Signing in... 🌸";


    try {

        const result =
            await signInWithPopup(
                auth,
                provider
            );


        currentUser =
            result.user;


        await currentUser.getIdToken(true);


        console.log(
            "Google login successful"
        );

        console.log(
            "User:",
            currentUser.email
        );

        console.log(
            "UID:",
            currentUser.uid
        );


        if (
            currentUser.displayName
        ) {

            nameInput.value =
                currentUser.displayName;

        }


        showNameScreen();

    }

    catch (error) {

        console.error(
            "Google login error:",
            error
        );

        loginError.textContent =
            "Google Sign-In failed.\n\n" +
            error.message;

    }

    finally {

        googleButton.disabled =
            false;

        googleButton.textContent =
            "🔵  Continue with Google";

    }

}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async function(user) {

        if (!user) {

            currentUser = null;

            loginScreen.style.display =
                "flex";

            nameScreen.style.display =
                "none";

            chatScreen.style.display =
                "none";

            return;
        }


        currentUser =
            user;


        try {

            await user.getIdToken(true);

        }

        catch (error) {

            console.error(
                "Could not refresh Firebase token:",
                error
            );

            return;

        }


        const savedName =
            localStorage.getItem(
                "flavi_user_name"
            );


        if (savedName) {

            userName =
                savedName;

            showChatScreen();

        }

        else {

            showNameScreen();

        }

    }
);


/* =========================================================
   SHOW NAME SCREEN
========================================================= */

function showNameScreen() {

    loginScreen.style.display =
        "none";

    nameScreen.style.display =
        "flex";

    chatScreen.style.display =
        "none";

}


/* =========================================================
   SHOW CHAT SCREEN
========================================================= */

function showChatScreen() {

    loginScreen.style.display =
        "none";

    nameScreen.style.display =
        "none";

    chatScreen.style.display =
        "block";


    if (currentUser) {

        userInfo.textContent =
            currentUser.email || "";

    }

}


/* =========================================================
   SAVE NAME
========================================================= */

function saveName() {

    if (!currentUser) {

        alert(
            "Please sign in with Google first."
        );

        return;

    }


    const name =
        nameInput.value.trim();


    if (!name) {

        alert(
            "Please enter your name."
        );

        return;

    }


    userName =
        name;


    localStorage.setItem(
        "flavi_user_name",
        userName
    );


    showChatScreen();


    /*
     * Remove the temporary waiting text.
     */

    const welcome =
        messages.querySelector(
            ".welcome-message"
        );

    if (welcome) {
        welcome.remove();
    }


    if (
        messages.children.length === 0
    ) {

        addMessage(
            "ai",
            `Hi ${userName}! 🌸 I'm Flavi. Nice to meet you!`
        );

    }


    messageInput.focus();

}


document
    .getElementById("startButton")
    .addEventListener(
        "click",
        saveName
    );


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    type,
    text
) {

    const div =
        document.createElement("div");


    div.className =
        "message " + type;


    div.textContent =
        text;


    messages.appendChild(div);


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================================================
   GET FIREBASE TOKEN
========================================================= */

async function getFreshFirebaseToken(
    forceRefresh = false
) {

    if (!currentUser) {

        throw new Error(
            "No authenticated Firebase user."
        );

    }


    const token =
        await currentUser.getIdToken(
            forceRefresh
        );


    if (!token) {

        throw new Error(
            "Firebase did not return an ID token."
        );

    }


    return token;

}


/* =========================================================
   SEND REQUEST TO WORKER
========================================================= */

async function callFlaviWorker(
    text,
    forceRefresh = false
) {

    const idToken =
        await getFreshFirebaseToken(
            forceRefresh
        );


    const response =
        await fetch(
            AI_WORKER_URL,
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        message:
                            text,

                        name:
                            userName ||
                            currentUser.displayName ||
                            "friend",

                        idToken:
                            idToken

                    })

            }
        );


    const raw =
        await response.text();


    console.log(
        "Worker status:",
        response.status
    );


    console.log(
        "Worker response:",
        raw
    );


    let data = null;


    try {

        data =
            JSON.parse(raw);

    }

    catch {

        data = null;

    }


    return {
        response,
        raw,
        data
    };

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const text =
        messageInput.value.trim();


    if (!text)
        return;


    if (!currentUser) {

        addMessage(
            "ai",
            "Please sign in with Google first 🌸"
        );

        return;

    }


    if (!userName) {

        userName =
            currentUser.displayName ||
            "friend";

    }


    addMessage(
        "user",
        text
    );


    messageInput.value =
        "";


    sendButton.disabled =
        true;

    messageInput.disabled =
        true;


    const thinking =
        document.createElement("div");


    thinking.className =
        "message ai typing";


    thinking.textContent =
        "Flavi is thinking";


    messages.appendChild(
        thinking
    );


    messages.scrollTop =
        messages.scrollHeight;


    try {

        /*
         * FIRST ATTEMPT
         */

        let result =
            await callFlaviWorker(
                text,
                false
            );


        /*
         * REFRESH TOKEN AND RETRY
         */

        if (
            result.response.status === 401
        ) {

            console.warn(
                "Worker rejected token. Refreshing..."
            );


            result =
                await callFlaviWorker(
                    text,
                    true
                );

        }


        thinking.remove();


        /* =================================================
           AUTH FAILURE
        ================================================= */

        if (
            result.response.status === 401 ||
            result.response.status === 403
        ) {

            console.error(
                "Authentication failed:",
                result.raw
            );


            addMessage(
                "ai",
                "Flavi couldn't verify your Google login 🌸\n\nPlease sign out, sign in again, and try once more."
            );


            return;

        }


        /* =================================================
           SERVER ERROR
        ================================================= */

        if (
            !result.response.ok
        ) {

            addMessage(
                "ai",
                "Flavi's AI brain returned an error 😭\n\n" +
                result.raw
            );


            return;

        }


        /* =================================================
           INVALID RESPONSE
        ================================================= */

        if (!result.data) {

            addMessage(
                "ai",
                "Flavi returned invalid data 😭\n\n" +
                result.raw
            );


            return;

        }


        /* =================================================
           AI REPLY
        ================================================= */

        if (
            result.data.reply
        ) {

            addMessage(
                "ai",
                result.data.reply
            );

        }

        else {

            addMessage(
                "ai",
                "Flavi returned an unexpected response 😭"
            );

        }

    }

    catch (error) {

        console.error(
            "Flavi connection error:",
            error
        );


        thinking.remove();


        addMessage(
            "ai",
            "Unable to connect to Flavi's AI brain 😭\n\n" +
            error.message
        );

    }

    finally {

        sendButton.disabled =
            false;

        messageInput.disabled =
            false;

        messageInput.focus();

    }

}


/* =========================================================
   ENTER KEY
========================================================= */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   SIGN OUT
========================================================= */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async function() {

            try {

                await signOut(auth);


                currentUser =
                    null;

                userName =
                    "";


                localStorage.removeItem(
                    "flavi_user_name"
                );


                messages.innerHTML =
                    `<div class="welcome-message">
                        🌸 Flavi is waiting for you...
                    </div>`;


                console.log(
                    "Signed out successfully."
                );

            }

            catch (error) {

                console.error(
                    "Sign out error:",
                    error
                );

            }

        }
    );


</script>
