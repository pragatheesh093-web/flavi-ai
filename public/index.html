<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: #fff;
    overflow: hidden;

    background:
        radial-gradient(circle at 15% 20%,
            rgba(255, 170, 205, .32),
            transparent 28%),

        radial-gradient(circle at 85% 15%,
            rgba(255, 130, 185, .25),
            transparent 30%),

        radial-gradient(circle at 50% 90%,
            rgba(255, 110, 180, .20),
            transparent 32%),

        linear-gradient(
            135deg,
            #170f18,
            #24111e,
            #180f19
        );
}


/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(45px);
    opacity: .35;
    animation: floatBlob 12s ease-in-out infinite;
}

.blob.one {
    width: 280px;
    height: 280px;
    background: #ff7fb5;
    top: -80px;
    left: -80px;
}

.blob.two {
    width: 350px;
    height: 350px;
    background: #ffb4d5;
    right: -120px;
    top: 20%;
    animation-delay: -4s;
}

.blob.three {
    width: 300px;
    height: 300px;
    background: #e66ca8;
    left: 30%;
    bottom: -150px;
    animation-delay: -7s;
}

@keyframes floatBlob {
    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(40px,-30px) scale(1.15);
    }
}


/* =========================================================
   FLOATING HEARTS / FLOWERS
========================================================= */

.particle {
    position: absolute;
    color: rgba(255, 190, 215, .7);
    font-size: 18px;
    animation: rise 10s linear infinite;
}

@keyframes rise {
    from {
        transform:
            translateY(110vh)
            rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    85% {
        opacity: .5;
    }

    to {
        transform:
            translateY(-15vh)
            rotate(360deg);
        opacity: 0;
    }
}


/* =========================================================
   INTRO
========================================================= */

#introScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #ff9fc6,
            #3a1629 48%,
            #120b11 100%
        );

    animation: introFadeOut 1s ease 3.4s forwards;
}

.intro-content {
    text-align: center;
    animation: introZoom 1.5s cubic-bezier(.2,.8,.2,1);
}

.intro-flower {
    font-size: 85px;

    filter:
        drop-shadow(0 0 25px rgba(255,150,200,.8));

    animation:
        introFlower 1.5s ease-in-out infinite alternate;
}

.intro-title {
    margin-top: 15px;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -2px;
}

.intro-subtitle {
    margin-top: 8px;
    color: #ffd8e8;
    font-size: 16px;
}

@keyframes introZoom {
    from {
        opacity: 0;
        transform: scale(.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes introFlower {
    from {
        transform: scale(.9) rotate(-5deg);
    }

    to {
        transform: scale(1.08) rotate(5deg);
    }
}

@keyframes introFadeOut {
    to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }
}


/* =========================================================
   SCREENS
========================================================= */

.screen {
    position: relative;
    z-index: 2;

    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   GLASS CARD
========================================================= */

.card {
    width: 430px;
    max-width: calc(100% - 30px);

    padding: 42px 34px;

    text-align: center;

    border-radius: 30px;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid rgba(255,255,255,.16);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.12);

    animation:
        cardAppear .9s ease;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.logo {
    font-size: 70px;

    margin-bottom: 8px;

    animation:
        logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

.card h1 {
    font-size: 34px;
    margin-bottom: 8px;
}

.card p {
    color: #e7cbd7;
    margin-bottom: 22px;
}


/* =========================================================
   INPUTS
========================================================= */

input {
    width: 100%;

    padding: 16px 18px;

    border: 1px solid rgba(255,255,255,.1);
    outline: none;

    border-radius: 16px;

    background:
        rgba(0,0,0,.22);

    color: white;

    font-size: 16px;

    transition: .2s;
}

input::placeholder {
    color: #bda8b2;
}

input:focus {
    border-color: #ff9bc4;

    box-shadow:
        0 0 0 4px rgba(255,140,190,.12);
}


/* =========================================================
   BUTTONS
========================================================= */

button {
    border: none;
    outline: none;

    cursor: pointer;

    color: white;

    font-weight: 700;

    transition:
        transform .2s,
        box-shadow .2s,
        opacity .2s;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: scale(.97);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}

.primary-button {
    width: 100%;

    margin-top: 14px;

    padding: 16px;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #ff72aa,
            #ff9ac6
        );

    box-shadow:
        0 10px 30px rgba(255,100,165,.25);
}

.google-button {
    width: 100%;

    padding: 15px;

    border-radius: 15px;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid rgba(255,255,255,.15);
}

.account-info {
    margin-top: 15px;
    color: #cbb5c0;
    font-size: 13px;
}

.error {
    color: #ff9cae;
    margin-top: 15px;
    font-size: 14px;
    white-space: pre-wrap;
}


/* =========================================================
   CHAT
========================================================= */

#chatScreen {
    position: relative;
    z-index: 5;

    width: 100%;
    height: 100vh;

    display: none;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    position: fixed;

    left: 0;
    top: 0;
    bottom: 0;

    width: 270px;

    z-index: 30;

    padding: 22px 15px;

    background:
        rgba(24,13,22,.82);

    border-right:
        1px solid rgba(255,255,255,.09);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    transition:
        transform .3s ease;
}

.sidebar-logo {
    display: flex;
    align-items: center;
    gap: 11px;

    padding: 10px;

    margin-bottom: 25px;
}

.sidebar-logo-icon {
    font-size: 32px;
}

.sidebar-logo-text {
    font-size: 21px;
    font-weight: 800;
}

.sidebar-logo-text span {
    color: #ff91bc;
}

.side-label {
    color: #9e8490;
    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1.5px;

    padding:

}

.side-button {
    width: 100%;

    align-items: center;
    gap: 13px;

    padding: 13px 14px;

    margin-bottom: 5px;

    border-radius: 14px;

    background: transparent;

    color: #e6d3dc;

    text-align: left;

    font-size: 14px;
}

.side-button:hover {
    background:

}

.side-button.active {
    background:
        linear-gradient(
            135deg,
            rgba(255,111,174,.22),
            rgba(255,160,205,.08)

    color: white;
}

.side-icon {
    width: 25px;
    text-align: center;
    font-size: 18px;
}

.sidebar-bottom {
    position: absolute;
    left: 15px;
    right: 15px;
    bottom: 20px;
}

.owner-badge {
    display: none;

    margin-bottom: 10px;

    padding: 10px;

    border-radius: 12px;

    background:
        rgba(255,170,210,.1);

    color: #ffb6d4;

    font-size: 12px;

    text-align: center;
}


/* =========================================================
   MAIN CHAT AREA
========================================================= */

.chat-main {
    position: relative;

    margin-left: 270px;

    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   CHAT HEADER
========================================================= */

.chat-header {
    height: 70px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    background:

}

.chat-header-left {

    gap: 12px;
}

.header-flower {

}

.header-title {

.header-status {

}

.header-user {

}


/* =========================================================
   MESSAGES
========================================================= */

#messages {

    overflow-y: auto;

    padding:

}

#messages::-webkit-scrollbar {
    width: 7px;
}

#messages::-webkit-scrollbar-thumb {

    border-radius: 20px;
}

.message {

    padding:

    margin:

    border-radius: 20px;

    line-height: 1.55;

    white-space: pre-wrap;

    word-wrap: break-word;

    animation:
        messageAppear .25s ease;
}

@keyframes messageAppear {
    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {

    background:

}

.message.ai {
    margin-right: auto;

    background:
        rgba(255,255,255,.075);

    border:

}

.message.typing {
    color: #dcbccc;
    font-style: italic;
}


/* =========================================================
   INPUT AREA
========================================================= */

.input-area {

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        18px 6% 22px;

    display: flex;
    gap: 10px;

    background:
        linear-gradient(
            transparent,

}

.input-area input {

    backdrop-filter:

}

.send-button {

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #ff70ac,
            #ff9bc5
        );
}


/* =========================================================
   MOBILE SIDEBAR
========================================================= */

.menu-button {
    display: none;

    width: 42px;
    height: 42px;

    border-radius: 13px;

    background:
        rgba(255,255,255,.08);

    font-size: 20px;
}

.sidebar-overlay {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 25;

    background:
        rgba(0,0,0,.45);
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.5);

    backdrop-filter:
        blur(8px);
}

.modal.show {
    display: flex;
}

.modal-card {
    width: 550px;
    max-width: 100%;
    max-height: 80vh;

    overflow-y: auto;

    padding: 25px;

    border-radius: 25px;

    background:
        rgba(35,18,29,.94);

    border:
        1px solid rgba(255,255,255,.12);

    box-shadow:
        0 30px 100px rgba(0,0,0,.5);

    animation:
        cardAppear .3s ease;
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.modal-header h2 {
    font-size: 22px;
}

.close-button {
    width: 36px;
    height: 36px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.08);

    font-size: 18px;
}

.modal-content {
    color: #dbc8d1;
    line-height: 1.6;
}

.announcement {
    padding: 15px;

    margin-bottom: 10px;

    border-radius: 15px;

    background:
        rgba(255,145,190,.08);

    border:
        1px solid rgba(255,145,190,.1);
}

.announcement-title {
    color: #ff9dc5;
    font-weight: 700;
    margin-bottom: 5px;
}

.announcement-date {
    margin-top: 7px;
    font-size: 11px;
    color: #8f7984;
}


/* =========================================================
   OWNER PANEL
========================================================= */

.command-box {
    margin-top: 15px;

    padding: 15px;

    border-radius: 15px;

    background:
        rgba(0,0,0,.18);

    font-family:
        Consolas,
        monospace;

    color: #ffc4dd;

    font-size: 13px;

    line-height: 1.8;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 800px) {

    .sidebar {
        transform: translateX(-100%);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .sidebar-overlay.open {
        display: block;
    }

    .chat-main {
        margin-left: 0;
    }

    .menu-button {
        display: block;
    }

    .header-user {
        display: none;
    }

    #messages {
        padding-left: 18px;
        padding-right: 18px;
    }

    .input-area {
        padding-left: 12px;
        padding-right: 12px;
    }

    .message {
        max-width: 88%;
    }

    .send-button {
        width: 75px;
    }

}

@media (max-width: 500px) {

    .card {
        padding: 32px 22px;
    }

    .intro-title {
        font-size: 38px;
    }

    .intro-flower {
        font-size: 70px;
    }

    .chat-header {
        padding: 0 12px;
    }

}


/* =========================================================
   HIDDEN
========================================================= */

.hidden {
    display: none !important;
}

</style>

/* =========================================================
   AIRA VOICE
========================================================= */

function loadVoices() {

    if (!("speechSynthesis" in window)) {
        return;
    }

    availableVoices =
        speechSynthesis.getVoices();

    console.log(
        "Available voices:",
        availableVoices.map(v => ({
            name: v.name,
            lang: v.lang
        }))
    );
}


loadVoices();


if ("speechSynthesis" in window) {

    speechSynthesis.onvoiceschanged =
        loadVoices;

}


/* =========================================================
   REMOVE EMOJIS FROM SPEECH
========================================================= */

function cleanTextForSpeech(text) {

    return String(text)

        /*
         * Remove emoji/pictographs.
         */
        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            ""
        )

        /*
         * Remove emoji variation selectors
         * and zero-width joiners.
         */
        .replace(
            /[\uFE0F\u200D]/g,
            ""
        )

        /*
         * Remove excessive whitespace.
         */
        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =========================================================
   SPEAK FLAVI
========================================================= */

function speakFlavi(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    const cleanText =
        cleanTextForSpeech(text);


    if (!cleanText) {
        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );


    /*
     * Prefer the Aira voice from
     * your available Microsoft voices.
     */

    const aira =
        availableVoices.find(
            voice =>
                voice.name
                    .toLowerCase()
                    .includes("aira")
        );


    /*
     * Backup natural English female
     * voices if Aira is temporarily
     * unavailable.
     */

    const backup =
        availableVoices.find(
            voice =>
                /aria|zira|libby|heather/i
                    .test(voice.name) &&
                /^en-/i.test(voice.lang)
        );


    if (aira) {

        utterance.voice =
            aira;

        utterance.lang =
            aira.lang || "en-US";

    }

    else if (backup) {

        utterance.voice =
            backup;

        utterance.lang =
            backup.lang || "en-US";

    }

    else {

        utterance.lang =
            "en-US";

    }


    utterance.rate =
        1.02;

    utterance.pitch =
        1.12;

    utterance.volume =
        1;


    speechSynthesis.speak(
        utterance
    );

}

   GOOGLE BUTTON
========================================================= */

const googleButton =

googleButton.className =
    "google-button";


googleButton.textContent =

/* =========================================================
   GOOGLE LOGIN
========================================================= */

async function loginWithGoogle() {

    loginError.textContent =
        "";


    googleButton.disabled =
        true;


    googleButton.textContent =
        "Signing in...";


    try {

        const result =
            await signInWithPopup(
                auth,
                provider
            );


        currentUser =
            result.user;


        await currentUser.getIdToken(
            true
        );


        if (
            currentUser.displayName
        ) {

            nameInput.value =
                currentUser.displayName;

        }


        showNameScreen();

    }

    catch (error) {

        console.error(
            "Google login error:",
            error
        );


        loginError.textContent =
            "Google Sign-In failed.\n\n" +
            error.message;

    }

    finally {

        googleButton.disabled =
            false;


        googleButton.textContent =
            "🔵 Continue with Google";

    }

}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async function(user) {

        if (!user) {

            currentUser =
                null;

            loginScreen.style.display =
                "flex";

            nameScreen.classList.add(
                "hidden"
            );

            chatScreen.style.display =
                "none";

            return;

        }


        currentUser =
            user;


        try {

            await user.getIdToken(
                true
            );

        }

        catch (error) {

            console.error(
                "Token refresh failed:",
                error
            );

            return;

        }


        const savedName =
            localStorage.getItem(
                "flavi_user_name"
            );


        if (savedName) {

                savedName;

            showChatScreen();

        }

);

   NAME SCREEN
========================================================= */

/* =========================================================
   SAVE NAME
========================================================= */

function saveName() {

    if (!currentUser) {

        alert(
            "Please sign in with Google first."
        );

        return;

    }


    const name =
        nameInput.value.trim();


    if (!name) {

        alert(

/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    type,
    text,
    speak = false
) {

    const div =
        document.createElement("div");


    div.className =
        "message " + type;


    div.textContent =
        text;


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;


    if (
        type === "ai" &&
        speak
    ) {

        speakFlavi(text);

    }

}


/* =========================================================
   FIREBASE TOKEN
========================================================= */

async function getFreshFirebaseToken(
    forceRefresh = false
) {

    if (!currentUser) {

        throw new Error(
            "No authenticated Firebase user."
        );

    }


    const token =
        await currentUser.getIdToken(
            forceRefresh
        );


    if (!token) {

        throw new Error(
            "Firebase did not return an ID token."
        );

    }


    return token;

}


/* =========================================================
   WORKER REQUEST
========================================================= */

async function callFlaviWorker(
    text,
    forceRefresh = false
) {

    const idToken =
        await getFreshFirebaseToken(
            forceRefresh
        );


    const response =
        await fetch(
            AI_WORKER_URL,
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        message:
                            text,

                        name:
                            userName ||
                            currentUser.displayName ||
                            "friend",

                        idToken:
                            idToken

                    })

            }
        );


    const raw =
        await response.text();


    let data = null;


    try {

        data =
            JSON.parse(raw);

    }

    catch {

        data =
            null;

    }


    return {
        response,
        raw,
        data
    };

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(
    customMessage = null
) {

    const text =
        customMessage !== null
            ? customMessage.trim()
            : messageInput.value.trim();


    if (!text) {
        return;
    }


    if (!currentUser) {

        addMessage(
            "ai",
            "Please sign in with Google first 🌸"
        );

        return;

    }


    if (!userName) {

        userName =
            currentUser.displayName ||
            "friend";

    }


    addMessage(
        "user",
        text
    );


    messageInput.value =
        "";


    sendButton.disabled =
        true;

    messageInput.disabled =
        true;


    const thinking =
        document.createElement("div");


    thinking.className =
        "message ai typing";


    thinking.textContent =
        "Flavi is thinking... 🌸";


    messages.appendChild(
        thinking
    );


    try {

        let result =
            await callFlaviWorker(
                text,
                false
            );


        if (
            result.response.status === 401
        ) {

            result =
                await callFlaviWorker(
                    text,
                    true
                );

        }


        thinking.remove();


        if (
            result.response.status === 401 ||
            result.response.status === 403
        ) {

            addMessage(
                "ai",
                "Flavi couldn't verify your Google login 🌸\n\nPlease sign out, sign in again, and try once more."
            );

            return;

        }


        if (
            !result.response.ok
        ) {

            addMessage(
                "ai",
                "Flavi's AI brain returned an error 😭\n\n" +
                result.raw
            );

            return;

        }


        if (!result.data) {

            addMessage(
                "ai",
                "Flavi returned invalid data 😭\n\n" +
                result.raw
            );

            return;

        }


        if (
            result.data.reply
        ) {

            addMessage(
                "ai",
                result.data.reply,
                true
            );

        }

        else {

            addMessage(
                "ai",
                "Flavi returned an unexpected response 😭"
            );

        }

    }

    catch (error) {

        console.error(
            "Flavi connection error:",
            error
        );


        thinking.remove();


        addMessage(
            "ai",
            "Unable to connect to Flavi's AI brain 😭\n\n" +
            error.message
        );

    }

    finally {

        sendButton.disabled =
            false;

        messageInput.disabled =
            false;

        messageInput.focus();

    }

}

/* =========================================================
   SIDEBAR BUTTONS

document
    .querySelectorAll(".side-button[data-action]")
    .forEach(button => {

        button.addEventListener(
            "click",
            async () => {

                document
                    .querySelectorAll(
                        ".side-button[data-action]"
                    )
                    .forEach(btn =>
                        btn.classList.remove(
                            "active"
                        )
                    );


                button.classList.add(
                    "active"
                );


                const action =
                    button.dataset.action;


                closeSidebar();


                if (
                    action === "chat"
                ) {

                    messageInput.focus();

                    return;

                }


                if (
                    action ===
                    "announcements"
                ) {

                    await showAnnouncements();

                    return;

                }


                if (
                    action === "memories"
                ) {

                    await showMemories();

                    return;

                }


                if (
                    action === "owner"
                ) {

                    showOwnerCommands();

                    return;

                }


                if (
                    action === "about"
                ) {

                    window.location.href =
                        "about.html";

                }

            }

        );

    });

   ANNOUNCEMENTS SIDEBAR
========================================================= */

async function showAnnouncements() {

    openModal(

        "<p>Loading announcements... 🌸</p>"

    try {

        const result =
            await callFlaviWorker(

        if (
            result.data &&
            result.data.reply

            const text =
                result.data.reply;


            const html =

                    .replace(
                        /\n/g,
                        "<br>"
                    );


            openModal(

                `<div>${html}</div>`
            );

        else {

            openModal(
                "📢 Announcements",
                "<p>No announcements found 🌸</p>"
            );

    catch (error) {

        openModal(
            "📢 Announcements",
            `<p>Couldn't load announcements 😭</p>
             <p>${escapeHtml(error.message)}</p>`
        );

    }

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
