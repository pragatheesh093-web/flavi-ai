<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Flavi AI</title>

<script src="https://accounts.google.com/gsi/client"
        async
        defer></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: #0b0b12;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;
}

#app {
    width: 100%;
    max-width: 900px;
    height: 95vh;

    background: #11111b;

    border-radius: 20px;
    overflow: hidden;

    display: flex;
    flex-direction: column;

    box-shadow: 0 0 40px rgba(0,0,0,.5);
}

header {
    padding: 18px 25px;

    background: #171725;

    border-bottom: 1px solid #29293a;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.status {
    color: #55e878;
    font-size: 13px;
}

#loginScreen,
#nameScreen {

    flex: 1;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 30px;
}

#loginScreen h1,
#nameScreen h1 {

    font-size: 42px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
    text-align: center;
}

#nameInput {

    width: 100%;
    max-width: 400px;

    padding: 15px;

    border-radius: 10px;

    border: 1px solid #333348;

    background: #191925;

    color: white;

    font-size: 16px;

    outline: none;
}

button {

    border: none;

    border-radius: 10px;

    padding: 13px 22px;

    background: #7c5cff;

    color: white;

    font-size: 15px;

    cursor: pointer;
}

button:hover {
    opacity: .9;
}

#nameScreen,
#chat {
    display: none;
}

#chat {

    flex: 1;

    flex-direction: column;

    min-height: 0;
}

#messages {

    flex: 1;

    overflow-y: auto;

    padding: 25px;
}

.message {

    margin-bottom: 18px;

    max-width: 75%;

    padding: 13px 16px;

    border-radius: 15px;

    line-height: 1.5;

    white-space: pre-wrap;
}

.user {

    margin-left: auto;

    background: #6650d9;
}

.ai {

    background: #20202d;
}

#inputArea {

    padding: 15px;

    border-top: 1px solid #29293a;

    display: flex;

    gap: 10px;
}

#messageInput {

    flex: 1;

    max-width: none;

    padding: 15px;

    border-radius: 10px;

    border: 1px solid #333348;

    background: #191925;

    color: white;

    font-size: 16px;

    outline: none;
}

#logout {

    margin-left: 10px;

    padding: 7px 11px;

    font-size: 12px;

    background: #29293a;
}

@media(max-width:600px) {

    #app {
        height: 100vh;
        border-radius: 0;
    }

    .message {
        max-width: 90%;
    }
}

</style>

</head>

<body>

<div id="app">

<header>

    <div class="logo">
        🌸 Flavi AI
    </div>

    <div>

        <span class="status">
            ● Online
        </span>

        <button id="logout"
                onclick="logout()"
                style="display:none;">
            Logout
        </button>

    </div>

</header>


<!-- GOOGLE LOGIN -->

<div id="loginScreen">

    <h1>🌸 Flavi AI</h1>

    <div class="subtitle">
        Sign in with Google to start chatting.
    </div>

    <div id="googleButton"></div>

</div>


<!-- NAME -->

<div id="nameScreen">

    <h1>Welcome 🌸</h1>

    <div class="subtitle">
        What should Flavi call you?
    </div>

    <input
        id="nameInput"
        type="text"
        placeholder="Enter your name"
        autocomplete="name"
    >

    <button
        onclick="saveName()"
        style="margin-top:15px;">
        Continue
    </button>

</div>


<!-- CHAT -->

<div id="chat">

    <div id="messages"></div>

    <div id="inputArea">

        <input
            id="messageInput"
            type="text"
            placeholder="Message Flavi..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

</div>


<script>

let googleUser = null;
let userName = "";


// Google login callback

async function handleGoogleLogin(response) {

    try {

        const result = await fetch(
            "/api/google-login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    credential: response.credential
                })
            }
        );

        const data = await result.json();

        if (!data.success) {

            alert("Google login failed.");

            return;
        }

        googleUser = data.user;

        localStorage.setItem(
            "flaviGoogleUser",
            JSON.stringify(googleUser)
        );

        document.getElementById(
            "loginScreen"
        ).style.display = "none";

        document.getElementById(
            "nameScreen"
        ).style.display = "flex";

    } catch (error) {

        console.error(error);

        alert("Unable to connect to Flavi.");
    }
}


// Start Google button

function initializeGoogle() {

    if (
        typeof google === "undefined" ||
        !google.accounts
    ) {

        setTimeout(
            initializeGoogle,
            500
        );

        return;
    }

    google.accounts.id.initialize({

        client_id:
            "832720805972-30l3cv2qo975kd9qlk4ncopdo4q4onmd.apps.googleusercontent.com",

        callback:
            handleGoogleLogin

    });

    google.accounts.id.renderButton(

        document.getElementById(
            "googleButton"
        ),

        {
            theme: "filled_black",

            size: "large",

            text: "signin_with",

            shape: "pill",

            width: 280
        }

    );
}


// Save name

function saveName() {

    const input =
        document.getElementById(
            "nameInput"
        );

    const name =
        input.value.trim();

    if (!name) {

        alert(
            "Please enter your name."
        );

        return;
    }

    userName = name;

    localStorage.setItem(
        "flaviName",
        userName
    );

    document.getElementById(
        "nameScreen"
    ).style.display = "none";

    document.getElementById(
        "chat"
    ).style.display = "flex";

    document.getElementById(
        "logout"
    ).style.display = "inline-block";

    addMessage(
        "ai",
        `Hi ${userName}! 🌸 I'm Flavi. Nice to meet you!`
    );

    document.getElementById(
        "messageInput"
    ).focus();
}


// Add message

function addMessage(type, text) {

    const container =
        document.getElementById(
            "messages"
        );

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message " + type;

    div.textContent = text;

    container.appendChild(div);

    container.scrollTop =
        container.scrollHeight;
}


// Send message

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const message =
        input.value.trim();

    if (!message) return;

    input.value = "";

    addMessage(
        "user",
        message
    );

    const thinking =
        document.createElement(
            "div"
        );

    thinking.className =
        "message ai";

    thinking.id =
        "thinking";

    thinking.textContent =
        "Flavi is thinking...";

    document
        .getElementById("messages")
        .appendChild(thinking);

    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message,
                            name: userName
                        })
                }
            );

        const data =
            await response.json();

        document
            .getElementById(
                "thinking"
            )
            ?.remove();

        if (data.reply) {

            addMessage(
                "ai",
                data.reply
            );

        } else {

            addMessage(
                "ai",
                "Sorry, Flavi couldn't answer."
            );
        }

    } catch (error) {

        console.error(error);

        document
            .getElementById(
                "thinking"
            )
            ?.remove();

        addMessage(
            "ai",
            "Aiyo 😭 Flavi's AI brain is unavailable."
        );
    }
}


// Enter key

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                sendMessage();
            }

        }
    );


// Logout

function logout() {

    localStorage.removeItem(
        "flaviGoogleUser"
    );

    localStorage.removeItem(
        "flaviName"
    );

    location.reload();
}


// Existing login

window.onload = function() {

    const savedUser =
        localStorage.getItem(
            "flaviGoogleUser"
        );

    const savedName =
        localStorage.getItem(
            "flaviName"
        );

    if (savedUser && savedName) {

        googleUser =
            JSON.parse(savedUser);

        userName =
            savedName;

        document.getElementById(
            "loginScreen"
        ).style.display = "none";

        document.getElementById(
            "nameScreen"
        ).style.display = "none";

        document.getElementById(
            "chat"
        ).style.display = "flex";

        document.getElementById(
            "logout"
        ).style.display = "inline-block";

        addMessage(
            "ai",
            `Welcome back, ${userName}! 🌸`
        );

    } else {

        initializeGoogle();
    }
};

</script>

</body>
</html>
