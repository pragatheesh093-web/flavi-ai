<!-- ================= FIREBASE + FLAVI ================= -->

<script type="module">

    /*
    ==================================================
    FLAVI AI WORKER
    ==================================================
    */

    const AI_WORKER_URL =
        "https://flavi-ai-backend.pragatheesh687.workers.dev/api/chat";


    /*
    ==================================================
    FIREBASE
    ==================================================
    */

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged
    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    /*
    ==================================================
    FIREBASE CONFIG
    ==================================================
    */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCIGFFgukIL7uN38capAC_YX3nezDGFxLk",

        authDomain:
            "flavi-ai.firebaseapp.com",

        projectId:
            "flavi-ai",

        storageBucket:
            "flavi-ai.firebasestorage.app",

        messagingSenderId:
            "924955533897",

        appId:
            "1:924955533897:web:858db6f25255aba8ee5598"

    };


    /*
    ==================================================
    INITIALIZE FIREBASE
    ==================================================
    */

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const provider =
        new GoogleAuthProvider();


    /*
    ==================================================
    VARIABLES
    ==================================================
    */

    let currentUser = null;
    let userName = "";


    /*
    ==================================================
    GOOGLE LOGIN
    ==================================================
    */

    async function loginWithGoogle() {

        const errorBox =
            document.getElementById("loginError");

        errorBox.textContent = "";

        try {

            provider.setCustomParameters({
                prompt: "select_account"
            });

            const result =
                await signInWithPopup(
                    auth,
                    provider
                );

            const user =
                result.user;

            currentUser = user;

            console.log(
                "Google login successful"
            );

            console.log(
                "Name:",
                user.displayName
            );

            console.log(
                "Email:",
                user.email
            );

            console.log(
                "UID:",
                user.uid
            );


            /*
            Show name screen
            */

            document
                .getElementById("loginScreen")
                .style.display = "none";

            document
                .getElementById("nameScreen")
                .style.display = "flex";


            /*
            Put Google display name
            into the name box
            */

            if (user.displayName) {

                document
                    .getElementById("nameInput")
                    .value =
                    user.displayName;

            }

        }

        catch (error) {

            console.error(
                "Google login error:",
                error
            );

            errorBox.textContent =
                "Google Sign-In failed.\n\n" +
                error.message;

        }

    }


    /*
    ==================================================
    CREATE GOOGLE BUTTON
    ==================================================
    */

    const googleButton =
        document.createElement("button");

    googleButton.className =
        "google-button";

    googleButton.textContent =
        "🔵 Continue with Google";

    googleButton.addEventListener(
        "click",
        loginWithGoogle
    );

    document
        .getElementById("googleLogin")
        .appendChild(
            googleButton
        );


    /*
    ==================================================
    AUTH STATE
    ==================================================
    */

    onAuthStateChanged(
        auth,
        function(user) {

            if (user) {

                currentUser =
                    user;

                console.log(
                    "Logged in:",
                    user.email
                );

                console.log(
                    "UID:",
                    user.uid
                );

            }

        }
    );


    /*
    ==================================================
    SAVE NAME
    ==================================================
    */

    function saveName() {

        const input =
            document.getElementById(
                "nameInput"
            );

        const name =
            input.value.trim();


        if (!name) {

            alert(
                "Please enter your name."
            );

            return;

        }


        userName =
            name;


        document
            .getElementById("nameScreen")
            .style.display =
            "none";


        document
            .getElementById("chatScreen")
            .style.display =
            "block";


        addMessage(
            "ai",
            `Hi ${userName}! 🌸 I'm Flavi. Nice to meet you!`
        );

    }


    /*
    ==================================================
    START BUTTON
    ==================================================
    */

    document
        .getElementById("startButton")
        .addEventListener(
            "click",
            saveName
        );


    /*
    ==================================================
    ADD MESSAGE
    ==================================================
    */

    function addMessage(
        type,
        text
    ) {

        const messages =
            document.getElementById(
                "messages"
            );


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "message " + type;


        div.textContent =
            text;


        messages.appendChild(
            div
        );


        messages.scrollTop =
            messages.scrollHeight;

    }


    /*
    ==================================================
    SEND MESSAGE
    ==================================================
    */

    async function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );


        const text =
            input.value.trim();


        if (!text)
            return;


        /*
        Show user message
        */

        addMessage(
            "user",
            text
        );


        input.value = "";


        /*
        Thinking message
        */

        const thinking =
            document.createElement(
                "div"
            );


        thinking.className =
            "message ai typing";


        thinking.textContent =
            "Flavi is thinking... 🌸";


        document
            .getElementById("messages")
            .appendChild(
                thinking
            );


        try {

            console.log(
                "Sending message to:",
                AI_WORKER_URL
            );


            /*
            Send request to
            Cloudflare Worker
            */

            const response =
                await fetch(
                    AI_WORKER_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                message:
                                    text,

                                name:
                                    userName,

                                email:
                                    currentUser
                                        ? currentUser.email
                                        : null,

                                uid:
                                    currentUser
                                        ? currentUser.uid
                                        : null

                            })
                    }
                );


            /*
            Get response
            */

            const raw =
                await response.text();


            console.log(
                "Worker status:",
                response.status
            );

            console.log(
                "Worker response:",
                raw
            );


            thinking.remove();


            /*
            Worker error
            */

            if (!response.ok) {

                addMessage(
                    "ai",
                    "Flavi's AI brain returned an error 😭\n\n" +
                    raw
                );

                return;

            }


            /*
            Convert JSON
            */

            let data;

            try {

                data =
                    JSON.parse(raw);

            }

            catch {

                addMessage(
                    "ai",
                    "Flavi returned invalid data 😭\n\n" +
                    raw
                );

                return;

            }


            /*
            Show AI reply
            */

            if (data.reply) {

                addMessage(
                    "ai",
                    data.reply
                );

            }

            else {

                addMessage(
                    "ai",
                    "Flavi returned an unexpected response 😭\n\n" +
                    raw
                );

            }

        }

        catch (error) {

            console.error(
                "Connection error:",
                error
            );


            thinking.remove();


            addMessage(
                "ai",
                "Unable to connect to Flavi's AI brain 😭\n\n" +
                error.message
            );

        }

    }


    /*
    ==================================================
    ENTER KEY
    ==================================================
    */

    document
        .getElementById("messageInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


    /*
    ==================================================
    SEND BUTTON
    ==================================================
    */

    document
        .getElementById("sendButton")
        .addEventListener(
            "click",
            sendMessage
        );

</script>

</body>
</html>
