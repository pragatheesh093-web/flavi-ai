<!-- FLAVI CHAT -->

<script>

let userName = "";


/* CLOUDFLARE WORKER */

const AI_WORKER_URL =
    "https://flavi-ai-backend.pragatheesh687.workers.dev/api/chat";


/* SAVE NAME */

function saveName() {

    const name =
        document
            .getElementById("nameInput")
            .value
            .trim();

    if (!name) {

        alert(
            "Please enter your name."
        );

        return;

    }

    userName =
        name;


    document
        .getElementById("nameScreen")
        .style.display =
        "none";

    document
        .getElementById("chatScreen")
        .style.display =
        "block";


    addMessage(
        "ai",
        `Hi ${userName}! 🌸 I'm Flavi. Nice to meet you!`
    );

}


/* ADD MESSAGE */

function addMessage(
    type,
    text
) {

    const messages =
        document.getElementById(
            "messages"
        );

    const div =
        document.createElement(
            "div"
        );

    div.className =
        `message ${type}`;

    div.textContent =
        text;

    messages.appendChild(
        div
    );

    messages.scrollTop =
        messages.scrollHeight;

}


/* ENTER */

function handleEnter(event) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* SEND MESSAGE */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text)
        return;


    addMessage(
        "user",
        text
    );

    input.value = "";


    const thinking =
        document.createElement(
            "div"
        );

    thinking.className =
        "message ai typing";

    thinking.textContent =
        "Flavi is thinking... 🌸";


    document
        .getElementById("messages")
        .appendChild(
            thinking
        );


    try {

        const response =
            await fetch(
                AI_WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                text,

                            name:
                                userName
                        })
                }
            );


        const raw =
            await response.text();


        thinking.remove();


        if (!response.ok) {

            addMessage(
                "ai",
                "Flavi's AI brain returned an error 😭\n\n" +
                raw
            );

            return;

        }


        const data =
            JSON.parse(raw);


        if (data.reply) {

            addMessage(
                "ai",
                data.reply
            );

        } else {

            addMessage(
                "ai",
                "Flavi returned an unexpected response 😭"
            );

        }

    } catch (error) {

        console.error(
            error
        );

        thinking.remove();

        addMessage(
            "ai",
            "Unable to connect to Flavi's AI brain 😭\n\n" +
            error.message
        );

    }

}

</script>

</body>
