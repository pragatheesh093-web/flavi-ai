<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="jBwxrf0DYO2nrPKp2E3LjDNCwdnH1Hn5SssFw5nnFy8" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flavi AI</title>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f14;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 420px;
            max-width: 90%;
            padding: 35px;
            border-radius: 24px;
            background: #191922;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        p {
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: none;
            border-radius: 12px;
            background: #292934;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #ff6fae;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: .9;
        }

        #nameScreen,
        #chatScreen {
            display: none;
        }

        #messages {
            height: calc(100vh - 150px);
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            margin: 10px;
            border-radius: 18px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            margin-left: auto;
            background: #ff6fae;
        }

        .ai {
            margin-right: auto;
            background: #24242f;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 15px;
            display: flex;
            gap: 10px;
            background: #15151c;
        }

        .input-area input {
            margin: 0;
            flex: 1;
        }

        .input-area button {
            width: 100px;
        }

        .typing {
            opacity: .7;
            font-style: italic;
        }

        #googleLogin {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="screen">

    <div class="card">

        <div class="logo">🌸</div>

        <h1>Flavi AI</h1>

        <p>Your friendly AI companion.</p>

        <div id="googleLogin"></div>

    </div>

</div>


<!-- NAME -->

<div id="nameScreen" class="screen">

    <div class="card">

        <div class="logo">🌸</div>

        <h1>Welcome to Flavi</h1>

        <p>What should I call you?</p>

        <input
            id="nameInput"
            type="text"
            placeholder="Enter your name"
        >

        <button onclick="saveName()">
            Start Chatting
        </button>

    </div>

</div>


<!-- CHAT -->

<div id="chatScreen">

    <div id="messages"></div>

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Talk to Flavi..."
            onkeydown="handleEnter(event)"
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<script>

let userName = "";
let googleUser = null;


/* ==========================================
   CLOUDFLARE WORKER
========================================== */

const AI_WORKER_URL =
    "https://flavi-ai-backend.pragatheesh687.workers.dev/api/chat";


/* ==========================================
   GOOGLE SIGN-IN
========================================== */

function handleGoogleLogin(response) {

    console.log("Google login successful");

    try {

        /*
         Google returns a JWT credential.
         Decode the payload so we can get
         the user's name/email.
        */

        const payload =
            JSON.parse(
                atob(
                    response.credential
                        .split(".")[1]
                        .replace(/-/g, "+")
                        .replace(/_/g, "/")
                )
            );

        googleUser = payload;

        console.log("Google user:", googleUser);


        /*
         Move to name screen
        */

        document
            .getElementById("loginScreen")
            .style.display = "none";

        document
            .getElementById("nameScreen")
            .style.display = "flex";


        /*
         Automatically put Google account
         name into the name field.
        */

        if (payload.name) {

            document
                .getElementById("nameInput")
                .value = payload.name;

        }

    } catch (error) {

        console.error(
            "Google login error:",
            error
        );

        alert(
            "Google Sign-In failed. Please try again."
        );

    }

}


/* ==========================================
   INITIALIZE GOOGLE
========================================== */

window.onload = function() {

    if (
        typeof google !== "undefined" &&
        google.accounts &&
        google.accounts.id
    ) {

        google.accounts.id.initialize({

            client_id:
                "832720805972-30l3cv2qo975kd9qlk4ncopdo4q4onmd.apps.googleusercontent.com",

            callback:
                handleGoogleLogin,

            auto_select: false,

            cancel_on_tap_outside: true

        });


        google.accounts.id.renderButton(

            document.getElementById(
                "googleLogin"
            ),

            {
                theme: "filled_blue",
                size: "large",
                text: "signin_with",
                shape: "rectangular",
                width: 300
            }

        );

    } else {

        console.error(
            "Google Identity Services failed to load."
        );

    }

};


/* ==========================================
   SAVE NAME
========================================== */

function saveName() {

    const name =
        document
            .getElementById("nameInput")
            .value
            .trim();


    if (!name) {

        alert(
            "Please enter your name."
        );

        return;

    }


    userName = name;


    document
        .getElementById("nameScreen")
        .style.display = "none";


    document
        .getElementById("chatScreen")
        .style.display = "block";


    addMessage(
        "ai",
        `Hi ${userName}! 🌸 I'm Flavi. Nice to meet you!`
    );

}


/* ==========================================
   ADD MESSAGE
========================================== */

function addMessage(type, text) {

    const messages =
        document.getElementById(
            "messages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        `message ${type}`;


    div.textContent =
        text;


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* ==========================================
   ENTER KEY
========================================== */

function handleEnter(event) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* ==========================================
   SEND MESSAGE
========================================== */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) return;


    addMessage(
        "user",
        text
    );


    input.value = "";


    const thinking =
        document.createElement(
            "div"
        );


    thinking.className =
        "message ai typing";


    thinking.textContent =
        "Flavi is thinking... 🌸";


    document
        .getElementById("messages")
        .appendChild(thinking);


    try {

        const response =
            await fetch(
                AI_WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: text,
                            name: userName
                        })
                }
            );


        const raw =
            await response.text();


        console.log(
            "Worker status:",
            response.status
        );

        console.log(
            "Worker response:",
            raw
        );


        thinking.remove();


        if (!response.ok) {

            addMessage(
                "ai",
                "Flavi's AI brain returned an error 😭\n\n" +
                raw
            );

            return;

        }


        const data =
            JSON.parse(raw);


        if (data.reply) {

            addMessage(
                "ai",
                data.reply
            );

        } else {

            addMessage(
                "ai",
                "Flavi returned an unexpected response 😭"
            );

        }


    } catch (error) {

        console.error(
            "Connection error:",
            error
        );


        thinking.remove();


        addMessage(
            "ai",
            "Unable to connect to Flavi's AI brain 😭\n\n" +
            error.message
        );

    }

}

</script>

</body>
</html>
