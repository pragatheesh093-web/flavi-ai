<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="Flavi AI — Your Friendly AI Companion">

<meta name="theme-color"
      content="#17101f">

<title>Flavi AI — Your Friendly AI Companion</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    color: white;

    overflow: hidden;

    background:
        #140d1b;
}


/* =========================================================
   MAIN CINEMATIC BACKGROUND
========================================================= */

.background {

    position: fixed;

    inset: 0;

    overflow: hidden;

    z-index: 0;

    background:

        radial-gradient(
            circle at 78% 22%,
            rgba(255,220,244,.20),
            transparent 18%
        ),

        radial-gradient(
            circle at 30% 20%,
            rgba(255,139,201,.20),
            transparent 30%
        ),

        linear-gradient(
            180deg,
            #d997bb 0%,
            #bd7fa6 28%,
            #74536f 58%,
            #241a31 100%
        );
}


/* =========================================================
   SOFT SKY LIGHT
========================================================= */

.sky-light {

    position: absolute;

    width: 520px;
    height: 520px;

    right: 2%;
    top: -130px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,235,249,.48),
            rgba(255,201,232,.16) 35%,
            transparent 70%
        );

    filter: blur(15px);

    animation:
        skyGlow 7s ease-in-out infinite;
}

@keyframes skyGlow {

    0%,
    100% {
        transform: scale(1);
        opacity: .8;
    }

    50% {
        transform: scale(1.08);
        opacity: 1;
    }
}


/* =========================================================
   MOON
========================================================= */

.moon {

    position: absolute;

    width: 115px;
    height: 115px;

    right: 11%;
    top: 11%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #ffeaf5 55%,
            #f7cfe5
        );

    box-shadow:

        0 0 35px rgba(255,238,249,.8),

        0 0 100px rgba(255,195,225,.55),

        0 0 180px rgba(255,172,216,.25);

    animation:
        moonFloat 6s ease-in-out infinite;
}

@keyframes moonFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(7px);
    }
}


/* =========================================================
   CLOUDS
========================================================= */

.cloud {

    position: absolute;

    height: 55px;

    border-radius: 100px;

    background:
        rgba(255,235,247,.12);

    filter: blur(12px);

    opacity: .8;
}

.cloud::before,
.cloud::after {

    content: "";

    position: absolute;

    border-radius: 50%;

    background:
        inherit;
}

.cloud.one {

    width: 300px;

    top: 21%;
    right: 24%;

    animation:
        cloudMove 25s linear infinite;
}

.cloud.one::before {

    width: 130px;
    height: 100px;

    left: 60px;
    bottom: 15px;
}

.cloud.one::after {

    width: 100px;
    height: 80px;

    right: 50px;
    bottom: 10px;
}


.cloud.two {

    width: 230px;

    top: 32%;
    left: 38%;

    opacity: .35;

    animation:
        cloudMove 32s linear infinite reverse;
}

@keyframes cloudMove {

    from {
        transform: translateX(-40px);
    }

    to {
        transform: translateX(80px);
    }
}


/* =========================================================
   MOUNTAINS
========================================================= */

.mountains {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 53%;
}


/* far mountains */

.mountain.far {

    position: absolute;

    bottom: 27%;

    width: 0;
    height: 0;

    border-left:
        350px solid transparent;

    border-right:
        350px solid transparent;

    border-bottom:
        310px solid rgba(92,65,96,.55);
}

.mountain.far.left {
    left: -260px;
}

.mountain.far.middle {
    left: 25%;
    transform: scale(.85);
}

.mountain.far.right {
    right: -270px;
    transform: scale(.9);
}


/* Mount Fuji */

.mount-fuji {

    position: absolute;

    left: 50%;

    bottom: 22%;

    transform:
        translateX(-50%);

    width: 0;
    height: 0;

    border-left:
        245px solid transparent;

    border-right:
        245px solid transparent;

    border-bottom:
        390px solid #44354f;

    filter:
        drop-shadow(
            0 20px 30px
            rgba(20,10,30,.25)
        );
}


/* snow cap */

.mount-fuji::before {

    content: "";

    position: absolute;

    left: -88px;

    top: 0;

    width: 0;
    height: 0;

    border-left:
        88px solid transparent;

    border-right:
        88px solid transparent;

    border-bottom:
        108px solid rgba(255,247,251,.95);
}


/* mountain shadow */

.mount-fuji::after {

    content: "";

    position: absolute;

    left: -245px;

    top: 155px;

    width: 490px;
    height: 230px;

    background:

        linear-gradient(
            145deg,
            transparent 47%,
            rgba(35,23,44,.45) 48%,
            rgba(35,23,44,.45) 65%,
            transparent 66%
        );

    opacity: .8;
}


/* =========================================================
   MOUNTAIN FOG
========================================================= */

.fog {

    position: absolute;

    left: -10%;

    width: 120%;

    height: 150px;

    bottom: 31%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(240,207,230,.16),
            rgba(255,232,245,.22),
            rgba(240,207,230,.12),
            transparent
        );

    filter: blur(20px);

    animation:
        fogMove 18s ease-in-out infinite alternate;
}

@keyframes fogMove {

    from {
        transform: translateX(-30px);
    }

    to {
        transform: translateX(40px);
    }
}


/* =========================================================
   GROUND
========================================================= */

.ground {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 40%;

    background:

        linear-gradient(
            180deg,
            rgba(50,34,57,.15),
            rgba(20,13,29,.88)
        );

    clip-path:
        polygon(
            0 25%,
            15% 12%,
            31% 23%,
            48% 8%,
            67% 22%,
            83% 10%,
            100% 20%,
            100% 100%,
            0 100%
        );
}


/* =========================================================
   DISTANT LIGHTS
========================================================= */

.village {

    position: absolute;

    bottom: 31%;

    left: 0;

    right: 0;

    height: 70px;

    opacity: .65;
}

.house-light {

    position: absolute;

    width: 5px;
    height: 4px;

    border-radius: 50%;

    background: #ffdca3;

    box-shadow:
        0 0 8px #ffdca3;

    animation:
        lightBlink 3s ease-in-out infinite;
}

@keyframes lightBlink {

    0%,
    100% {
        opacity: .4;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================================
   SAKURA TREES
========================================================= */

.tree {

    position: absolute;

    bottom: 8%;

    width: 180px;

    height: 520px;

    z-index: 2;
}

.tree.left {
    left: -35px;
}

.tree.right {
    right: -35px;
    transform: scaleX(-1);
}


.trunk {

    position: absolute;

    bottom: 0;

    left: 70px;

    width: 20px;

    height: 410px;

    border-radius: 20px;

    background:

        linear-gradient(
            90deg,
            #1d101d,
            #41263b,
            #180d18
        );

    transform:
        rotate(-5deg);
}


.branch {

    position: absolute;

    height: 13px;

    border-radius: 20px;

    background:
        #291525;

    transform-origin: left center;
}

.branch.one {

    width: 180px;

    top: 130px;

    left: 68px;

    transform:
        rotate(-28deg);
}

.branch.two {

    width: 140px;

    top: 205px;

    left: 55px;

    transform:
        rotate(25deg);
}

.branch.three {

    width: 155px;

    top: 85px;

    left: 65px;

    transform:
        rotate(18deg);
}


/* blossoms */

.blossoms {

    position: absolute;

    inset: 25px;

}

.blossom {

    position: absolute;

    width: 30px;
    height: 30px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle at center,
            #ffd7eb 0 12%,
            transparent 13%
        ),

        radial-gradient(
            circle at 25% 25%,
            #ffb8d7 0 35%,
            transparent 36%
        ),

        radial-gradient(
            circle at 75% 25%,
            #ffbfdc 0 35%,
            transparent 36%
        ),

        radial-gradient(
            circle at 25% 75%,
            #ffaed2 0 35%,
            transparent 36%
        ),

        radial-gradient(
            circle at 75% 75%,
            #ffb5d6 0 35%,
            transparent 36%
        );

    filter:
        drop-shadow(
            0 4px 10px
            rgba(255,128,184,.25)
        );

    animation:
        blossomSway 4s ease-in-out infinite;
}

@keyframes blossomSway {

    0%,
    100% {
        transform: rotate(-4deg);
    }

    50% {
        transform: rotate(5deg);
    }
}


/* =========================================================
   ANIME GIRL
========================================================= */

.girl {

    position: absolute;

    left: 50%;

    bottom: 3%;

    transform:
        translateX(-50%);

    width: 180px;

    height: 330px;

    z-index: 4;

    filter:
        drop-shadow(
            0 20px 30px
            rgba(0,0,0,.45)
        );
}


/* hair */

.girl-hair {

    position: absolute;

    left: 43px;

    top: 5px;

    width: 95px;

    height: 125px;

    border-radius:
        50px 50px 42px 42px;

    background:

        linear-gradient(
            90deg,
            #130f1b,
            #2a1a31,
            #100d17
        );

    box-shadow:
        inset -10px 0 20px rgba(255,150,210,.08);
}


/* hair strands */

.girl-hair::before,
.girl-hair::after {

    content: "";

    position: absolute;

    top: 65px;

    width: 35px;

    height: 145px;

    border-radius: 40px;

    background:
        linear-gradient(
            90deg,
            #0d0a12,
            #2b1930
        );
}

.girl-hair::before {

    left: -17px;

    transform:
        rotate(7deg);
}

.girl-hair::after {

    right: -17px;

    transform:
        rotate(-7deg);
}


/* neck */

.girl-neck {

    position: absolute;

    top: 105px;

    left: 75px;

    width: 30px;

    height: 32px;

    background: #e9b5bd;

    border-radius: 10px;

    z-index: -1;
}


/* body / dress */

.girl-body {

    position: absolute;

    left: 42px;

    top: 115px;

    width: 98px;

    height: 190px;

    border-radius:
        45px 45px 25px 25px;

    background:

        linear-gradient(
            90deg,
            #201327,
            #56314f 50%,
            #211327
        );

    box-shadow:
        inset 0 10px 25px rgba(255,190,225,.08);
}


/* dress highlight */

.girl-body::before {

    content: "";

    position: absolute;

    left: 25px;

    top: 5px;

    width: 48px;

    height: 150px;

    background:

        linear-gradient(
            180deg,
            rgba(255,182,219,.16),
            transparent
        );

    border-radius: 30px;
}


/* arms */

.girl-arm {

    position: absolute;

    top: 138px;

    width: 30px;

    height: 120px;

    border-radius: 25px;

    background:
        linear-gradient(
            90deg,
            #211428,
            #382038
        );

    z-index: 5;
}

.girl-arm.left {

    left: 27px;

    transform:
        rotate(8deg);
}

.girl-arm.right {

    right: 27px;

    transform:
        rotate(-8deg);
}


/* =========================================================
   WIND PETALS
========================================================= */

.petals {

    position: absolute;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 7;
}

.petal {

    position: absolute;

    width: 12px;
    height: 8px;

    border-radius:
        70% 30% 70% 30%;

    background:
        #ffc3df;

    opacity: .8;

    filter:
        drop-shadow(
            0 2px 4px
            rgba(255,140,190,.25)
        );

    animation:
        petalWind linear infinite;
}

@keyframes petalWind {

    0% {

        transform:
            translate(
                -10vw,
                -10vh
            )
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: .9;
    }

    50% {

        transform:
            translate(
                45vw,
                40vh
            )
            rotate(180deg);
    }

    100% {

        transform:
            translate(
                115vw,
                90vh
            )
            rotate(420deg);

        opacity: 0;
    }
}


/* =========================================================
   DARK OVERLAY
========================================================= */

.scene-overlay {

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            90deg,
            rgba(20,12,26,.42),
            transparent 28%,
            transparent 72%,
            rgba(20,12,26,.30)
        ),

        linear-gradient(
            0deg,
            rgba(15,9,21,.45),
            transparent 35%
        );

    z-index: 8;

    pointer-events: none;
}


/* =========================================================
   GLASS
========================================================= */

.glass {

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.055)
        );

    border:
        1px solid
        rgba(255,255,255,.20);

    backdrop-filter:
        blur(24px)
        saturate(125%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(125%);

    box-shadow:

        0 25px 80px
        rgba(15,8,25,.28),

        inset 0 1px 0
        rgba(255,255,255,.18);
}


/* =========================================================
   INTRO
========================================================= */

#introScreen {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;

    justify-content: center;

    background:

        radial-gradient(
            circle at center,
            #693c61,
            #160d1c 70%
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#introScreen.hide {

    opacity: 0;

    visibility: hidden;
}

.intro-content {

    text-align: center;

    animation:
        introIn 1.1s ease;
}

.intro-logo {

    width: 105px;
    height: 105px;

    margin:
        0 auto 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 32px;

    font-size: 56px;

    background:

        linear-gradient(
            135deg,
            #ff82bd,
            #a974ff
        );

    box-shadow:
        0 0 70px
        rgba(255,120,190,.5);

    animation:
        introPulse 2s ease-in-out infinite;
}

.intro-title {

    font-size: 48px;

    font-weight: 850;

    letter-spacing: -2px;
}

.intro-subtitle {

    margin-top: 9px;

    color:
        rgba(255,255,255,.62);
}

@keyframes introIn {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.9);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes introPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}


/* =========================================================
   SCREENS
========================================================= */

.screen {

    position: relative;

    width: 100%;

    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 20;
}


/* =========================================================
   LOGIN / NAME CARD
========================================================= */

.card {

    width: 430px;

    max-width: 92%;

    padding: 42px 36px;

    border-radius: 32px;

    text-align: center;

    animation:
        cardIn .7s ease;
}

@keyframes cardIn {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.95);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

.logo {

    width: 82px;
    height: 82px;

    margin:
        0 auto 20px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 26px;

    font-size: 45px;

    background:
        linear-gradient(
            135deg,
            #ff72b5,
            #a86cff
        );

    box-shadow:
        0 15px 50px
        rgba(255,105,180,.35);
}

.card h1 {

    font-size: 34px;

    margin-bottom: 10px;
}

.card p {

    color:
        rgba(255,255,255,.68);

    line-height: 1.6;

    margin-bottom: 25px;
}


/* =========================================================
   INPUT
========================================================= */

input {

    width: 100%;

    padding: 15px 17px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius: 16px;

    background:
        rgba(255,255,255,.09);

    color: white;

    outline: none;

    font-size: 16px;

    transition: .25s;
}

input::placeholder {

    color:
        rgba(255,255,255,.42);
}

input:focus {

    border-color:
        rgba(255,145,205,.7);

    box-shadow:
        0 0 0 4px
        rgba(255,125,190,.12);
}


/* =========================================================
   BUTTONS
========================================================= */

button {

    border: none;

    border-radius: 15px;

    padding: 14px 20px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #ff6daf,
            #a96cff
        );

    font-weight: 750;

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
}

button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 12px 35px
        rgba(255,105,180,.25);
}

button:active {

    transform:
        scale(.97);
}

button:disabled {

    opacity: .5;

    cursor:
        not-allowed;
}

#startButton {

    width: 100%;

    margin-top: 14px;
}


/* =========================================================
   GOOGLE
========================================================= */

#googleLogin {

    margin-top: 20px;
}

.google-button {

    width: 100%;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.16);

    box-shadow: none;
}

.google-button:hover {

    background:
        rgba(255,255,255,.16);

    box-shadow: none;
}

.account-info {

    margin-top: 15px;

    font-size: 12px;

    color:
        rgba(255,255,255,.42);
}

.error {

    margin-top: 14px;

    color:
        #ff9fba;

    font-size: 13px;

    white-space: pre-wrap;
}


/* =========================================================
   CHAT
========================================================= */

#chatScreen {

    position: relative;

    width: 100%;

    height: 100vh;

    z-index: 20;

    display: none;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    position: fixed;

    left: 18px;

    top: 18px;

    bottom: 18px;

    width: 245px;

    padding: 20px;

    border-radius: 27px;

    z-index: 50;

    display: flex;

    flex-direction: column;
}

.sidebar-brand {

    display: flex;

    align-items: center;

    gap: 12px;

    padding:
        5px 5px 25px;
}

.sidebar-brand-icon {

    width: 45px;
    height: 45px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #ff6eae,
            #a86cff
        );

    font-size: 23px;
}

.sidebar-brand strong {

    font-size: 18px;
}

.sidebar-brand small {

    display: block;

    margin-top: 2px;

    color:
        rgba(255,255,255,.48);
}

.sidebar-section {

    margin:
        8px 0 9px 7px;

    color:
        rgba(255,255,255,.40);

    font-size: 10px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1.2px;
}

.sidebar-button {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 13px 14px;

    margin-bottom: 5px;

    border-radius: 14px;

    background: transparent;

    color:
        rgba(255,255,255,.78);

    text-align: left;

    box-shadow: none;
}

.sidebar-button:hover {

    transform: none;

    background:
        rgba(255,255,255,.09);

    box-shadow: none;
}

.sidebar-button.active {

    background:
        linear-gradient(
            135deg,
            rgba(255,112,180,.28),
            rgba(170,100,255,.20)
        );

    color: white;
}

.sidebar-spacer {

    flex: 1;
}

.voice-status {

    padding: 12px;

    margin-bottom: 10px;

    border-radius: 15px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid
        rgba(255,255,255,.08);

    color:
        rgba(255,255,255,.56);

    font-size: 11px;

    line-height: 1.5;
}

.voice-status strong {

    color:
        #ffb9da;
}


/* =========================================================
   MAIN
========================================================= */

.chat-main {

    height: 100vh;

    margin-left: 281px;

    position: relative;

    display: flex;

    flex-direction: column;
}

.chat-header {

    height: 75px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 30px;

    background:
        rgba(25,14,30,.25);

    border-bottom:
        1px solid
        rgba(255,255,255,.09);

    backdrop-filter:
        blur(20px);
}

.chat-title {

    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 18px;

    font-weight: 800;
}

.online-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        #78f2a5;

    box-shadow:
        0 0 12px
        #78f2a5;
}

.user-info {

    color:
        rgba(255,255,255,.55);

    font-size: 12px;
}

<script type="module">


/* =========================================================
   WORKER
========================================================= */

const AI_WORKER_URL =
    "https://flavi-ai-backend.pragatheesh687.workers.dev/api/chat";


/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCIGFFgukIL7uN38capAC_YX3nezDGFxLk",

    authDomain:
        "flavi-ai.firebaseapp.com",

    projectId:
        "flavi-ai",

    storageBucket:
        "flavi-ai.firebasestorage.app",

    messagingSenderId:
        "924955533897",

    appId:
        "1:924955533897:web:858db6f25255aba8ee5598"
};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const provider =
    new GoogleAuthProvider();


provider.setCustomParameters({
    prompt:
        "select_account"
});


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;

let userName = "";

let flaviVoice = null;

let voiceEnabled =
    localStorage.getItem(
        "flavi_voice_enabled"
    ) !== "false";


/* =========================================================
   VOICE
========================================================= */

const FLAVI_VOICE_NAME =
    "Microsoft Aria Online (Natural) - English (United States)";


function loadFlaviVoice() {

    const voices =
        speechSynthesis.getVoices();

    flaviVoice =
        voices.find(
            voice =>
                voice.name ===
                FLAVI_VOICE_NAME
        ) || null;
}


speechSynthesis.addEventListener(
    "voiceschanged",
    loadFlaviVoice
);


loadFlaviVoice();


function speakFlavi(text) {

    if (!voiceEnabled)
        return;

    if (!text)
        return;

    loadFlaviVoice();

    if (!flaviVoice)
        return;

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.voice =
        flaviVoice;

    utterance.lang =
        "en-US";

    utterance.rate =
        .92;

    utterance.pitch =
        1.12;

    utterance.volume =
        1;

    speechSynthesis.speak(
        utterance
    );
}


/* =========================================================
   DOM
========================================================= */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const nameScreen =
    document.getElementById(
        "nameScreen"
    );

const chatScreen =
    document.getElementById(
        "chatScreen"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const loginError =
    document.getElementById(
        "loginError"
    );

const userInfo =
    document.getElementById(
        "userInfo"
    );

const messages =
    document.getElementById(
        "messages"
    );

const sidebar =
    document.getElementById(
        "sidebar"
    );


/* =========================================================
   GOOGLE LOGIN BUTTON
========================================================= */

const googleButton =
    document.createElement(
        "button"
    );

googleButton.className =
    "google-button";

googleButton.textContent =
    "🔵 Continue with Google";

googleButton.addEventListener(
    "click",
    loginWithGoogle
);

document
    .getElementById(
        "googleLogin"
    )
    .appendChild(
        googleButton
    );


async function loginWithGoogle() {

    loginError.textContent =
        "";

    googleButton.disabled =
        true;

    googleButton.textContent =
        "Signing in... 🌸";

    try {

        const result =
            await signInWithPopup(
                auth,
                provider
            );

        currentUser =
            result.user;

        await currentUser
            .getIdToken(true);

        if (
            currentUser.displayName
        ) {

            nameInput.value =
                currentUser.displayName;
        }

        showNameScreen();

    }

    catch (error) {

        console.error(
            error
        );

        loginError.textContent =
            "Google Sign-In failed.\n\n" +
            error.message;
    }

    finally {

        googleButton.disabled =
            false;

        googleButton.textContent =
            "🔵 Continue with Google";
    }
}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            currentUser =
                null;

            loginScreen.style.display =
                "flex";

            nameScreen.style.display =
                "none";

            chatScreen.style.display =
                "none";

            return;
        }


        currentUser =
            user;


        try {

            await user.getIdToken(
                true
            );

        }

        catch (error) {

            console.error(
                error
            );

            return;
        }


        const savedName =
            localStorage.getItem(
                "flavi_user_name"
            );


        if (savedName) {

            userName =
                savedName;

            showChatScreen();

        }

        else {

            showNameScreen();

        }

    }
);


/* =========================================================
   SCREENS
========================================================= */

function showNameScreen() {

    loginScreen.style.display =
        "none";

    nameScreen.style.display =
        "flex";

    chatScreen.style.display =
        "none";
}


function showChatScreen() {

    loginScreen.style.display =
        "none";

    nameScreen.style.display =
        "none";

    chatScreen.style.display =
        "block";


    if (currentUser) {

        userInfo.textContent =
            currentUser.email || "";

    }
}


/* =========================================================
   SAVE NAME
========================================================= */

function saveName() {

    if (!currentUser) {

        alert(
            "Please sign in with Google first."
        );

        return;
    }


    const name =
        nameInput.value.trim();


    if (!name) {

        nameInput.focus();

        return;
    }


    userName =
        name;


    localStorage.setItem(
        "flavi_user_name",
        userName
    );


    showChatScreen();


    if (
        messages.children.length ===
        0
    ) {

        const greeting =
            `Hi ${userName}! 🌸 I'm Flavi. Nice to meet you!`;

        addMessage(
            "ai",
            greeting
        );

        setTimeout(
            () => speakFlavi(greeting),
            500
        );
    }


    messageInput.focus();
}


document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        saveName
    );


nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            saveName();

        }

    }
);


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    type,
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message " + type;

    div.textContent =
        text;

    messages.appendChild(
        div
    );

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================================================
   FIREBASE TOKEN
========================================================= */

async function getFreshFirebaseToken(
    forceRefresh = false
) {

    if (!currentUser) {

        throw new Error(
            "No authenticated Firebase user."
        );
    }


    const token =
        await currentUser.getIdToken(
            forceRefresh
        );


    if (!token) {

        throw new Error(
            "Firebase did not return an ID token."
        );
    }


    return token;
}


/* =========================================================
   CALL FLAVI WORKER
========================================================= */

async function callFlaviWorker(
    text,
    forceRefresh = false
) {

    const idToken =
        await getFreshFirebaseToken(
            forceRefresh
        );


    const response =
        await fetch(
            AI_WORKER_URL,
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        message:
                            text,

                        name:
                            userName ||
                            currentUser.displayName ||
                            "friend",

                        idToken:
                            idToken

                    })

            }
        );


    const raw =
        await response.text();


    let data = null;


    try {

        data =
            JSON.parse(
                raw
            );

    }

    catch {

        data =
            null;

    }


    return {

        response,
        raw,
        data

    };
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const text =
        messageInput.value.trim();


    if (!text)
        return;


    if (!currentUser) {

        addMessage(
            "ai",
            "Please sign in with Google first 🌸"
        );

        return;
    }


    if (!userName) {

        userName =
            currentUser.displayName ||
            "friend";
    }


    addMessage(
        "user",
        text
    );


    messageInput.value =
        "";


    sendButton.disabled =
        true;

    messageInput.disabled =
        true;


    const thinking =
        document.createElement(
            "div"
        );


    thinking.className =
        "message ai typing";


    thinking.textContent =
        "Flavi is thinking... 🌸";


    messages.appendChild(
        thinking
    );


    messages.scrollTop =
        messages.scrollHeight;


    try {

        let result =
            await callFlaviWorker(
                text,
                false
            );


        if (
            result.response.status ===
            401
        ) {

            result =
                await callFlaviWorker(
                    text,
                    true
                );
        }


        thinking.remove();


        if (
            result.response.status === 401 ||
            result.response.status === 403
        ) {

            addMessage(
                "ai",
                "Flavi couldn't verify your Google login 🌸\n\nPlease sign out, sign in again, and try once more."
            );

            return;
        }


        if (
            !result.response.ok
        ) {

            addMessage(
                "ai",
                "Flavi's AI brain returned an error 😭\n\n" +
                result.raw
            );

            return;
        }


        if (!result.data) {

            addMessage(
                "ai",
                "Flavi returned invalid data 😭\n\n" +
                result.raw
            );

            return;
        }


        if (
            result.data.reply
        ) {

            addMessage(
                "ai",
                result.data.reply
            );


            speakFlavi(
                result.data.reply
            );

        }

        else {

            addMessage(
                "ai",
                "Flavi returned an unexpected response 😭"
            );
        }

    }

    catch (error) {

        console.error(
            error
        );


        thinking.remove();


        addMessage(
            "ai",
            "Unable to connect to Flavi's AI brain 😭\n\n" +
            error.message
        );
    }


    finally {

        sendButton.disabled =
            false;

        messageInput.disabled =
            false;

        messageInput.focus();
    }
}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);

========================================================= */

const modal =
    document.getElementById(
        "modal"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const modalText =
    document.getElementById(
        "modalText"
    );


function showModal(
    title,
    text
) {

    modalTitle.textContent =
        title;

    modalText.textContent =
        text;

    modal.classList.add(
        "show"
    );
}


document
    .getElementById(
        "modalClose"
    )
    .addEventListener(
        "click",
        () => {

            modal.classList.remove(
                "show"
            );

        }
    );


modal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            modal
        ) {

            modal.classList.remove(
                "show"
            );

        }

    }
);
