<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="google-site-verification"
        content="jBwxrf0DYO2nrPKp2E3LjDNCwdnH1Hn5SssFw5nnFy8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Flavi AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f14;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 420px;
            max-width: 90%;
            padding: 35px;
            border-radius: 24px;
            background: #191922;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }

        .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        p {
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: none;
            border-radius: 12px;
            background: #292934;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #ff6fae;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: .9;
        }

        #nameScreen,
        #chatScreen {
            display: none;
        }

        #messages {
            height: calc(100vh - 150px);
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            margin: 10px;
            border-radius: 18px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            margin-left: auto;
            background: #ff6fae;
        }

        .ai {
            margin-right: auto;
            background: #24242f;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 15px;
            display: flex;
            gap: 10px;
            background: #15151c;
        }

        .input-area input {
            margin: 0;
            flex: 1;
        }

        .input-area button {
            width: 100px;
        }

        .typing {
            opacity: .7;
            font-style: italic;
        }

        #googleLogin {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .google-button {
            width: 300px;
            background: #4285f4;
        }

        .google-button:hover {
            background: #357ae8;
        }

        .account-info {
            margin-top: 15px;
            font-size: 13px;
            color: #999;
        }

        .logout-button {
            margin-top: 10px;
            background: #33333f;
            padding: 10px;
            font-size: 13px;
        }

        .error {
            color: #ff6b6b;
            margin-top: 15px;
            font-size: 14px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>


<!-- =========================================
     LOGIN SCREEN
========================================= -->

<div id="loginScreen" class="screen">

    <div class="card">

        <div class="logo">🌸</div>

        <h1>Flavi AI</h1>

        <p>Your friendly AI companion.</p>

        <div id="googleLogin"></div>

        <div class="account-info">
            Sign in with your Google account
        </div>

        <div id="loginError" class="error"></div>

    </div>

</div>


<!-- =========================================
     NAME SCREEN
========================================= -->

<div id="nameScreen" class="screen">

    <div class="card">

        <div class="logo">🌸</div>

        <h1>Welcome to Flavi</h1>

        <p>What should I call you?</p>

        <input
            id="nameInput"
            type="text"
            placeholder="Enter your name"
        >

        <button onclick="saveName()">
            Start Chatting
        </button>

    </div>

</div>


<!-- =========================================
     CHAT SCREEN
========================================= -->

<div id="chatScreen">

    <div id="messages"></div>

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Talk to Flavi..."
            onkeydown="handleEnter(event)"
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<!-- =========================================
     FIREBASE AUTHENTICATION
========================================= -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    /* =========================================
       FIREBASE CONFIG
    ========================================= */

  const firebaseConfig = {
  apiKey: "AIzaSyCIGFFgukIL7uN38capAC_YX3nezDGFxLk",
  authDomain: "flavi-ai.firebaseapp.com",
  projectId: "flavi-ai",
  storageBucket: "flavi-ai.firebasestorage.app",
  messagingSenderId: "924955533897",
  appId: "1:924955533897:web:858db6f25255aba8ee5598"
};


    /* =========================================
       INITIALIZE FIREBASE
    ========================================= */

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const provider =
        new GoogleAuthProvider();


    /* =========================================
       VARIABLES
    ========================================= */

    let googleUser = null;

    let userName = "";


    /* =========================================
       CLOUDFLARE WORKER
    ========================================= */

    const AI_WORKER_URL =
        "https://flavi-ai-backend.pragatheesh687.workers.dev/api/chat";


    /* =========================================
       GOOGLE LOGIN
    ========================================= */

    window.loginWithGoogle =
        async function () {

            const errorBox =
                document.getElementById(
                    "loginError"
                );

            errorBox.textContent = "";


            try {

                console.log(
                    "Starting Firebase Google login..."
                );


                const result =
                    await signInWithPopup(
                        auth,
                        provider
                    );


                googleUser =
                    result.user;


                console.log(
                    "================================"
                );

                console.log(
                    "Firebase Google Login SUCCESS"
                );

                console.log(
                    "Name:",
                    googleUser.displayName
                );

                console.log(
                    "Email:",
                    googleUser.email
                );

                console.log(
                    "UID:",
                    googleUser.uid
                );

                console.log(
                    "================================"
                );


                /*
                    Firebase now knows this user.

                    The account should appear in:

                    Firebase
                    → Authentication
                    → Users
                */


                document
                    .getElementById(
                        "loginScreen"
                    )
                    .style.display =
                    "none";


                document
                    .getElementById(
                        "nameScreen"
                    )
                    .style.display =
                    "flex";


                /*
                    Use Google display name
                */

                if (
                    googleUser.displayName
                ) {

                    document
                        .getElementById(
                            "nameInput"
                        )
                        .value =
                        googleUser.displayName;

                }

            }

            catch (error) {

                console.error(
                    "Firebase login error:",
                    error
                );


                let message =
                    "Google Sign-In failed.";


                if (
                    error.code ===
                    "auth/popup-blocked"
                ) {

                    message =
                        "The Google login popup was blocked. Please allow popups for Flavi.";

                }

                else if (
                    error.code ===
                    "auth/popup-closed-by-user"
                ) {

                    message =
                        "The Google login window was closed.";

                }

                else if (
                    error.code ===
                    "auth/unauthorized-domain"
                ) {

                    message =
                        "Flavi's domain is not authorized in Firebase.\n\nAdd flavi-ai.pages.dev to Firebase Authentication → Settings → Authorized domains.";

                }

                else {

                    message =
                        error.message;

                }


                errorBox.textContent =
                    message;

            }

        };


    /* =========================================
       CREATE GOOGLE BUTTON
    ========================================= */

    function createGoogleButton() {

        const container =
            document.getElementById(
                "googleLogin"
            );


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "google-button";


        button.textContent =
            "🔵 Continue with Google";


        button.onclick =
            window.loginWithGoogle;


        container.appendChild(
            button
        );

    }


    /* =========================================
       AUTH STATE LISTENER
    ========================================= */

    onAuthStateChanged(
        auth,
        function (user) {

            if (user) {

                googleUser =
                    user;


                console.log(
                    "Firebase authenticated user:"
                );

                console.log(
                    user.email
                );

                console.log(
                    "UID:",
                    user.uid
                );

            }

        }
    );


    /* =========================================
       CREATE LOGIN BUTTON
    ========================================= */

    createGoogleButton();


</script>


<!-- =========================================
     FLAVI CHAT
========================================= -->

<script>


/* =========================================
   SAVE NAME
========================================= */

function saveName() {

    const input =
        document.getElementById(
            "nameInput"
        );


    const name =
        input.value.trim();


    if (!name) {

        alert(
            "Please enter your name."
        );

        return;

    }


    userName =
        name;


    document
        .getElementById(
            "nameScreen"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "chatScreen"
        )
        .style.display =
        "block";


    addMessage(
        "ai",
        `Hi ${userName}! 🌸 I'm Flavi. Nice to meet you!`
    );

}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(
    type,
    text
) {

    const messages =
        document.getElementById(
            "messages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        `message ${type}`;


    div.textContent =
        text;


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================================
   ENTER KEY
========================================= */

function handleEnter(
    event
) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text)
        return;


    addMessage(
        "user",
        text
    );


    input.value = "";


    const thinking =
        document.createElement(
            "div"
        );


    thinking.className =
        "message ai typing";


    thinking.textContent =
        "Flavi is thinking... 🌸";


    document
        .getElementById(
            "messages"
        )
        .appendChild(
            thinking
        );


    try {

        const response =
            await fetch(
                AI_WORKER_URL,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            name:
                                userName

                        })

                }
            );


        const raw =
            await response.text();


        console.log(
            "Worker status:",
            response.status
        );


        console.log(
            "Worker response:",
            raw
        );


        thinking.remove();


        if (!response.ok) {

            addMessage(
                "ai",
                "Flavi's AI brain returned an error 😭\n\n" +
                raw
            );

            return;

        }


        let data;


        try {

            data =
                JSON.parse(raw);

        }

        catch {

            addMessage(
                "ai",
                "Flavi returned an invalid response 😭\n\n" +
                raw
            );

            return;

        }


        if (
            data.reply
        ) {

            addMessage(
                "ai",
                data.reply
            );

        }

        else {

            addMessage(
                "ai",
                "Flavi returned an unexpected response 😭"
            );

        }

    }

    catch (error) {

        console.error(
            "Connection error:",
            error
        );


        thinking.remove();


        addMessage(
            "ai",
            "Unable to connect to Flavi's AI brain 😭\n\n" +
            error.message
        );

    }

}


</script>


</body>
</html>
