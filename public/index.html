<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="google-site-verification"
          content="jBwxrf0DYO2nrPKp2E3LjDNCwdnH1Hn5SssFw5nnFy8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Flavi AI - A friendly AI companion created by Pragatheesh.">

    <meta name="theme-color"
          content="#0f0f14">

    <title>Flavi AI — Your Friendly AI Companion</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f14;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 420px;
            max-width: 90%;
            padding: 35px;
            border-radius: 24px;
            background: #191922;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        p {
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: none;
            border-radius: 12px;
            background: #292934;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            outline: 2px solid #ff6fae;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #ff6fae;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: .9;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #nameScreen,
        #chatScreen {
            display: none;
        }

        #messages {
            height: calc(100vh - 150px);
            overflow-y: auto;
            padding: 25px;
            padding-bottom: 100px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            margin: 10px;
            border-radius: 18px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user {
            margin-left: auto;
            background: #ff6fae;
        }

        .ai {
            margin-right: auto;
            background: #24242f;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 15px;
            display: flex;
            gap: 10px;
            background: #15151c;
            border-top: 1px solid #292934;
        }

        .input-area input {
            margin: 0;
            flex: 1;
        }

        .input-area button {
            width: 100px;
        }

        .typing {
            opacity: .7;
            font-style: italic;
        }

        #googleLogin {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .google-button {
            width: 300px;
            background: #4285f4;
        }

        .account-info {
            margin-top: 15px;
            font-size: 13px;
            color: #999;
        }

        .error {
            color: #ff6b6b;
            margin-top: 15px;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background: #15151c;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
            border-bottom: 1px solid #292934;
        }

        .flavi-title {
            font-weight: bold;
            font-size: 18px;
        }

        .user-info {
            font-size: 13px;
            color: #aaa;
        }

        #chatScreen #messages {
            padding-top: 75px;
        }

        .logout-button {
            width: auto;
            padding: 8px 14px;
            font-size: 13px;
            background: #292934;
        }

        @media (max-width: 600px) {

            .message {
                max-width: 85%;
            }

            .input-area button {
                width: 80px;
            }

            .user-info {
                display: none;
            }

        }

    </style>

</head>

<body>


<!-- =========================================================
     LOGIN SCREEN
========================================================= -->

<div id="loginScreen" class="screen">

    <div class="card">

        <div class="logo">
            🌸
        </div>

        <h1>
            Flavi AI
        </h1>

        <p>
            Your friendly AI companion.
        </p>

        <div id="googleLogin"></div>

        <div class="account-info">
            Sign in with your Google account
        </div>

        <div id="loginError"
             class="error">
        </div>

    </div>

</div>


<!-- =========================================================
     NAME SCREEN
========================================================= -->

<div id="nameScreen" class="screen">

    <div class="card">

        <div class="logo">
            🌸
        </div>

        <h1>
            Welcome to Flavi
        </h1>

        <p>
            What should I call you?
        </p>

        <input
            id="nameInput"
            type="text"
            placeholder="Enter your name"
            autocomplete="name"
        >

        <button id="startButton">
            Start Chatting
        </button>

    </div>

</div>


<!-- =========================================================
     CHAT SCREEN
========================================================= -->

<div id="chatScreen">

    <div class="top-bar">

        <div class="flavi-title">
            🌸 Flavi AI
        </div>

        <div
            id="userInfo"
            class="user-info">
        </div>

        <button
            id="logoutButton"
            class="logout-button">
            Sign Out
        </button>

    </div>


    <div id="messages"></div>


    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Talk to Flavi..."
            autocomplete="off"
        >

        <button id="sendButton">
            Send
        </button>

    </div>

</div>


<!-- =========================================================
     FIREBASE + FLAVI
========================================================= -->

<script type="module">


    /* =========================================================
       FLAVI WORKER
    ========================================================= */

    const AI_WORKER_URL =
        "https://flavi-ai-backend.pragatheesh687.workers.dev/api/chat";


    /* =========================================================
       FIREBASE IMPORTS
    ========================================================= */

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
        signOut
    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    /* =========================================================
       FIREBASE CONFIG
    ========================================================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCIGFFgukIL7uN38capAC_YX3nezDGFxLk",

        authDomain:
            "flavi-ai.firebaseapp.com",

        projectId:
            "flavi-ai",

        storageBucket:
            "flavi-ai.firebasestorage.app",

        messagingSenderId:
            "924955533897",

        appId:
            "1:924955533897:web:858db6f25255aba8ee5598"

    };


    /* =========================================================
       INITIALIZE FIREBASE
    ========================================================= */

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const provider =
        new GoogleAuthProvider();


    provider.setCustomParameters({
        prompt: "select_account"
    });


    /* =========================================================
       VARIABLES
    ========================================================= */

    let currentUser = null;
    let userName = "";


    /* =========================================================
       DOM
    ========================================================= */

    const loginScreen =
        document.getElementById("loginScreen");

    const nameScreen =
        document.getElementById("nameScreen");

    const chatScreen =
        document.getElementById("chatScreen");

    const nameInput =
        document.getElementById("nameInput");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const loginError =
        document.getElementById("loginError");

    const userInfo =
        document.getElementById("userInfo");

    const messages =
        document.getElementById("messages");


    /* =========================================================
       GOOGLE LOGIN BUTTON
    ========================================================= */

    const googleButton =
        document.createElement("button");

    googleButton.className =
        "google-button";

    googleButton.textContent =
        "🔵 Continue with Google";

    googleButton.addEventListener(
        "click",
        loginWithGoogle
    );

    document
        .getElementById("googleLogin")
        .appendChild(googleButton);


    /* =========================================================
       GOOGLE LOGIN
    ========================================================= */

    async function loginWithGoogle() {

        loginError.textContent = "";

        googleButton.disabled = true;

        googleButton.textContent =
            "Signing in...";


        try {

            const result =
                await signInWithPopup(
                    auth,
                    provider
                );


            currentUser =
                result.user;


            /*
             * Immediately request a fresh token.
             * This confirms Firebase can issue
             * a valid ID token.
             */

            await currentUser.getIdToken(true);


            console.log(
                "Google login successful"
            );

            console.log(
                "User:",
                currentUser.email
            );

            console.log(
                "UID:",
                currentUser.uid
            );


            if (
                currentUser.displayName
            ) {

                nameInput.value =
                    currentUser.displayName;

            }


            showNameScreen();

        }

        catch (error) {

            console.error(
                "Google login error:",
                error
            );

            loginError.textContent =
                "Google Sign-In failed.\n\n" +
                error.message;

        }

        finally {

            googleButton.disabled =
                false;

            googleButton.textContent =
                "🔵 Continue with Google";

        }

    }


    /* =========================================================
       AUTH STATE
    ========================================================= */

    onAuthStateChanged(
        auth,
        async function(user) {

            if (!user) {

                currentUser = null;

                loginScreen.style.display =
                    "flex";

                nameScreen.style.display =
                    "none";

                chatScreen.style.display =
                    "none";

                return;
            }


            currentUser =
                user;


            console.log(
                "Authenticated:",
                user.email
            );


            console.log(
                "UID:",
                user.uid
            );


            /*
             * Make sure the Firebase session
             * can provide a fresh ID token.
             */

            try {

                await user.getIdToken(true);

                console.log(
                    "Firebase token refreshed successfully."
                );

            }

            catch (error) {

                console.error(
                    "Could not refresh Firebase token:",
                    error
                );

                return;
            }


            const savedName =
                localStorage.getItem(
                    "flavi_user_name"
                );


            if (savedName) {

                userName =
                    savedName;

                showChatScreen();

            }

            else {

                showNameScreen();

            }

        }
    );


    /* =========================================================
       SHOW NAME SCREEN
    ========================================================= */

    function showNameScreen() {

        loginScreen.style.display =
            "none";

        nameScreen.style.display =
            "flex";

        chatScreen.style.display =
            "none";

    }


    /* =========================================================
       SHOW CHAT SCREEN
    ========================================================= */

    function showChatScreen() {

        loginScreen.style.display =
            "none";

        nameScreen.style.display =
            "none";

        chatScreen.style.display =
            "block";


        if (currentUser) {

            userInfo.textContent =
                currentUser.email || "";

        }

    }


    /* =========================================================
       SAVE NAME
    ========================================================= */

    function saveName() {

        if (!currentUser) {

            alert(
                "Please sign in with Google first."
            );

            return;

        }


        const name =
            nameInput.value.trim();


        if (!name) {

            alert(
                "Please enter your name."
            );

            return;

        }


        userName =
            name;


        localStorage.setItem(
            "flavi_user_name",
            userName
        );


        showChatScreen();


        if (
            messages.children.length === 0
        ) {

            addMessage(
                "ai",
                `Hi ${userName}! 🌸 I'm Flavi. Nice to meet you!`
            );

        }


        messageInput.focus();

    }


    document
        .getElementById("startButton")
        .addEventListener(
            "click",
            saveName
        );


    /* =========================================================
       ADD MESSAGE
    ========================================================= */

    function addMessage(
        type,
        text
    ) {

        const div =
            document.createElement("div");


        div.className =
            "message " + type;


        div.textContent =
            text;


        messages.appendChild(div);


        messages.scrollTop =
            messages.scrollHeight;

    }


    /* =========================================================
       GET FIREBASE TOKEN
    ========================================================= */

    async function getFreshFirebaseToken(
        forceRefresh = false
    ) {

        if (!currentUser) {

            throw new Error(
                "No authenticated Firebase user."
            );

        }


        /*
         * Firebase handles token caching,
         * expiration and refresh internally.
         */

        const token =
            await currentUser.getIdToken(
                forceRefresh
            );


        if (!token) {

            throw new Error(
                "Firebase did not return an ID token."
            );

        }


        return token;

    }


    /* =========================================================
       SEND REQUEST TO WORKER
    ========================================================= */

    async function callFlaviWorker(
        text,
        forceRefresh = false
    ) {

        const idToken =
            await getFreshFirebaseToken(
                forceRefresh
            );


        console.log(
            "Sending Firebase token to Worker..."
        );


        const response =
            await fetch(
                AI_WORKER_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            name:
                                userName ||
                                currentUser.displayName ||
                                "friend",

                            idToken:
                                idToken

                        })

                }
            );


        const raw =
            await response.text();


        console.log(
            "Worker status:",
            response.status
        );


        console.log(
            "Worker response:",
            raw
        );


        let data = null;


        try {

            data =
                JSON.parse(raw);

        }

        catch {

            data = null;

        }


        return {
            response,
            raw,
            data
        };

    }


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    async function sendMessage() {

        const text =
            messageInput.value.trim();


        if (!text)
            return;


        if (!currentUser) {

            addMessage(
                "ai",
                "Please sign in with Google first 🌸"
            );

            return;

        }


        if (!userName) {

            userName =
                currentUser.displayName ||
                "friend";

        }


        addMessage(
            "user",
            text
        );


        messageInput.value =
            "";


        sendButton.disabled =
            true;

        messageInput.disabled =
            true;


        const thinking =
            document.createElement("div");


        thinking.className =
            "message ai typing";


        thinking.textContent =
            "Flavi is thinking... 🌸";


        messages.appendChild(
            thinking
        );


        try {

            /*
             * FIRST ATTEMPT
             *
             * Use Firebase's current token.
             */

            let result =
                await callFlaviWorker(
                    text,
                    false
                );


            /*
             * If Worker rejects the token,
             * force Firebase to refresh it
             * and retry ONCE.
             */

            if (
                result.response.status === 401
            ) {

                console.warn(
                    "Worker rejected token. Refreshing Firebase token..."
                );


                result =
                    await callFlaviWorker(
                        text,
                        true
                    );

            }


            thinking.remove();


            /* =================================================
               AUTHENTICATION STILL FAILED
            ================================================= */

            if (
                result.response.status === 401 ||
                result.response.status === 403
            ) {

                console.error(
                    "Authentication failed after token refresh:",
                    result.raw
                );


                addMessage(
                    "ai",
                    "Flavi couldn't verify your Google login 🌸\n\nPlease sign out, sign in again, and try once more."
                );


                return;

            }


            /* =================================================
               OTHER SERVER ERROR
            ================================================= */

            if (
                !result.response.ok
            ) {

                addMessage(
                    "ai",
                    "Flavi's AI brain returned an error 😭\n\n" +
                    result.raw
                );


                return;

            }


            /* =================================================
               JSON RESPONSE
            ================================================= */

            if (!result.data) {

                addMessage(
                    "ai",
                    "Flavi returned invalid data 😭\n\n" +
                    result.raw
                );


                return;

            }


            /* =================================================
               AI REPLY
            ================================================= */

            if (
                result.data.reply
            ) {

                addMessage(
                    "ai",
                    result.data.reply
                );

            }

            else {

                addMessage(
                    "ai",
                    "Flavi returned an unexpected response 😭"
                );

            }

        }

        catch (error) {

            console.error(
                "Flavi connection error:",
                error
            );


            thinking.remove();


            addMessage(
                "ai",
                "Unable to connect to Flavi's AI brain 😭\n\n" +
                error.message
            );

        }

        finally {

            sendButton.disabled =
                false;

            messageInput.disabled =
                false;

            messageInput.focus();

        }

    }


    /* =========================================================
       ENTER KEY
    ========================================================= */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =========================================================
       SEND BUTTON
    ========================================================= */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /* =========================================================
       SIGN OUT
    ========================================================= */

    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            async function() {

                try {

                    await signOut(auth);


                    currentUser =
                        null;

                    userName =
                        "";


                    localStorage.removeItem(
                        "flavi_user_name"
                    );


                    messages.innerHTML =
                        "";


                    console.log(
                        "Signed out successfully."
                    );

                }

                catch (error) {

                    console.error(
                        "Sign out error:",
                        error
                    );

                }

            }
        );


</script>

</body>

</html>
