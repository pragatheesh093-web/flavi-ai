<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flavina AI</title>

    <!-- Google Identity Services -->
    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f14;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 420px;
            max-width: 90%;
            padding: 35px;
            border-radius: 24px;
            background: #191922;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        p {
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: none;
            border-radius: 12px;
            background: #292934;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 0 2px #ff6fae;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #ff6fae;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: .9;
        }

        #nameScreen,
        #chatScreen {
            display: none;
        }

        #googleButton {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

        #messages {
            height: calc(100vh - 150px);
            overflow-y: auto;
            padding: 25px;
            padding-bottom: 100px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            margin: 10px;
            border-radius: 18px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user {
            margin-left: auto;
            background: #ff6fae;
        }

        .ai {
            margin-right: auto;
            background: #24242f;
        }

        .typing {
            opacity: .7;
            font-style: italic;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 15px;
            display: flex;
            gap: 10px;
            background: #15151c;
        }

        .input-area input {
            margin: 0;
            flex: 1;
        }

        .input-area button {
            width: 100px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }

            .message {
                max-width: 85%;
            }

            .input-area button {
                width: 80px;
            }
        }
    </style>
</head>

<body>

<!-- ==================== -->
<!-- GOOGLE LOGIN -->
<!-- ==================== -->

<div id="loginScreen" class="screen">

    <div class="card">

        <div class="logo">🌸</div>

        <h1>Flavina AI</h1>

        <p>Your friendly AI companion.</p>

        <div id="googleButton"></div>

    </div>

</div>


<!-- ==================== -->
<!-- NAME SCREEN -->
<!-- ==================== -->

<div id="nameScreen" class="screen">

    <div class="card">

        <div class="logo">🌸</div>

        <h1>Welcome to Flavina</h1>

        <p>What should I call you?</p>

        <input
            id="nameInput"
            type="text"
            placeholder="Enter your name"
        >

        <button onclick="saveName()">
            Start Chatting
        </button>

    </div>

</div>


<!-- ==================== -->
<!-- CHAT SCREEN -->
<!-- ==================== -->

<div id="chatScreen">

    <div id="messages"></div>

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Talk to Flavina..."
            onkeydown="handleEnter(event)"
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<script>

/* ============================= */
/* CONFIGURATION */
/* ============================= */

const GOOGLE_CLIENT_ID =
    "832720805972-30l3cv2qo975kd9qlk4ncopdo4q4onmd.apps.googleusercontent.com";

const AI_WORKER_URL =
    "https://flavi-ai-backend.pragatheesh687.workers.dev/api/chat";

let userName = "";

let googleUser = null;


/* ============================= */
/* GOOGLE SIGN-IN */
/* ============================= */

window.onload = function () {

    if (
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.id
    ) {

        console.error(
            "Google Identity Services failed to load."
        );

        return;
    }

    google.accounts.id.initialize({

        client_id: GOOGLE_CLIENT_ID,

        callback: handleGoogleLogin

    });


    google.accounts.id.renderButton(

        document.getElementById("googleButton"),

        {
            theme: "filled_black",
            size: "large",
            text: "continue_with",
            shape: "pill",
            width: 320
        }

    );

};


/* ============================= */
/* GOOGLE LOGIN CALLBACK */
/* ============================= */

function handleGoogleLogin(response) {

    try {

        const token = response.credential;

        const payload =
            JSON.parse(
                atob(
                    token
                        .split(".")[1]
                        .replace(/-/g, "+")
                        .replace(/_/g, "/")
                )
            );


        googleUser = payload;


        userName =
            payload.name ||
            "Pragatheesh";


        document.getElementById(
            "nameInput"
        ).value = userName;


        document.getElementById(
            "loginScreen"
        ).style.display = "none";


        document.getElementById(
            "nameScreen"
        ).style.display = "flex";


    } catch (error) {

        console.error(
            "Google login error:",
            error
        );

        alert(
            "Google login failed. Please try again."
        );

    }

}


/* ============================= */
/* SAVE NAME */
/* ============================= */

function saveName() {

    const name =
        document.getElementById(
            "nameInput"
        ).value.trim();


    if (!name) {

        alert(
            "Please enter your name."
        );

        return;
    }


    userName = name;


    document.getElementById(
        "nameScreen"
    ).style.display = "none";


    document.getElementById(
        "chatScreen"
    ).style.display = "block";


    addMessage(
        "ai",
        `Hi ${userName}! 🌸\nI'm Flavina. Nice to meet you! ❤️`
    );

}


/* ============================= */
/* ADD MESSAGE */
/* ============================= */

function addMessage(type, text) {

    const messages =
        document.getElementById(
            "messages"
        );


    const div =
        document.createElement("div");


    div.className =
        `message ${type}`;


    div.textContent =
        text;


    messages.appendChild(div);


    messages.scrollTop =
        messages.scrollHeight;

}


/* ============================= */
/* ENTER KEY */
/* ============================= */

function handleEnter(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }

}


/* ============================= */
/* SEND MESSAGE TO AI */
/* ============================= */
async function sendMessage() {

    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (!text) return;

    addMessage("user", text);

    input.value = "";

    const thinking = document.createElement("div");
    thinking.className = "message ai typing";
    thinking.textContent = "Flavina is thinking... 🌸";

    document.getElementById("messages").appendChild(thinking);

    try {

        const response = await fetch(
            "https://flavi-ai-backend.pragatheesh687.workers.dev/api/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: text,
                    name: userName
                })
            }
        );

        const raw = await response.text();

        console.log("Worker status:", response.status);
        console.log("Worker response:", raw);

        thinking.remove();

        if (!response.ok) {
            addMessage(
                "ai",
                "My AI brain returned an error 😭\n\n" + raw
            );
            return;
        }

        const data = JSON.parse(raw);

        if (data.reply) {
            addMessage("ai", data.reply);
        } else {
            addMessage(
                "ai",
                "I received a response, but I couldn't understand it 😭"
            );
        }

    } catch (error) {

        console.error("Connection error:", error);

        thinking.remove();

        addMessage(
            "ai",
            "Unable to connect to Flavi's AI brain 😭\n\n" +
            error.message
        );
    }
}

</script>

</body>
</html>
